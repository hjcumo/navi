  </header>

    * { box-sizing: border-box; }

    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

    /* ── 페이지 ── */
    .page-shell {
      width: 100%;
      max-width: 464px;
      margin: 0 auto;
      padding: calc(20px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));
      animation: arrive 260ms ease-out both;
    }
    .app-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 750; letter-spacing: -.035em; }
    .brand-mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: var(--ink); color: var(--page); }
    .brand-mark .icon { width: 19px; height: 19px; }
    .theme-switch { display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--ink); }
    .theme-switch .icon { width: 18px; height: 18px; }

    .intro { margin: 26px 0 20px; }
    .eyebrow { margin: 0 0 8px; font-size: 11px; font-weight: 650; color: var(--muted); letter-spacing: .06em; }
    .intro-title { margin: 0; font-size: 30px; line-height: 1.28; font-weight: 800; letter-spacing: -.065em; word-break: keep-all; }
    .intro-title span { color: var(--green-text); }
    .intro-description { margin: 8px 0 0; font-size: 13px; line-height: 1.6; color: var(--muted); letter-spacing: -.03em; }

    /* ── 목적지 카드: 현재 위치 → 도착지 경로 ── */
    .destination {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: 22px 22px 18px;
      border-radius: var(--radius);
      background: var(--hero);
      color: var(--hero-ink);
    }
    .route-art { position: absolute; top: 0; right: 0; width: 142px; height: 122px; color: #9cc4a6; opacity: .2; z-index: -1; pointer-events: none; }
    .destination-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .destination-label { display: flex; align-items: center; gap: 7px; margin: 0; color: var(--hero-muted); font-size: 12px; font-weight: 650; }
    .destination-label .icon { width: 16px; height: 16px; }
    .destination-tag { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--hero-line); border-radius: 20px; padding: 4px 10px; font-size: 10.5px; font-weight: 650; color: var(--hero-muted); line-height: 1.4; }
    .destination-tag::before { content: &quot;&quot;; width: 5px; height: 5px; background: var(--yellow); border-radius: 50%; }

    .trip { display: grid; grid-template-columns: 24px minmax(0, 1fr); column-gap: 13px; align-items: center; margin-bottom: 20px; }
    .from-dot { justify-self: center; width: 13px; height: 13px; border-radius: 50%; border: 2.5px solid var(--hero-muted); }
    .from-text { margin: 0; font-size: 13px; font-weight: 600; color: var(--hero-muted); }
    .rail { justify-self: center; width: 3px; height: 38px; margin: 7px 0; border-radius: 3px; background: var(--yellow); transform-origin: top; }

    .trip .pin .dot { fill: var(--hero); }
    .destination h1 { margin: 0; font-size: 27px; font-weight: 800; line-height: 1.38; letter-spacing: -.055em; word-break: keep-all; overflow-wrap: anywhere; }

    .coordinates { margin: 3px 0 0; color: var(--hero-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .copy-button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; flex: none; min-width: 48px; min-height: 48px; border: 1px solid var(--hero-line); border-radius: 13px; padding: 6px; background: transparent; color: var(--hero-ink); font-size: 9.5px; line-height: 1.4; }

    body[data-phase=&quot;ok&quot;] .trip .pin { animation: drop .45s cubic-bezier(.3, 1.5, .5, 1) .35s both; }
    body[data-phase=&quot;fail&quot;] .rail, body[data-phase=&quot;fail&quot;] .trip .pin { opacity: .3; }

    /* ── 상태 안내 + 출발 버튼 ── */
    .navigation { margin-top: 14px; }
    .status-panel { display: flex; align-items: flex-start; gap: 10px; background: var(--notice); color: var(--notice-ink); border-radius: 16px; padding: 14px 15px; margin: 0 0 12px; animation: arrive .22s ease-out both; }
    .status-panel[data-tone=&quot;error&quot;] { background: var(--error-bg); color: var(--error-ink); }
    .status-panel &gt; .icon { width: 18px; height: 18px; margin-top: 2px; }
    .status-copy { min-width: 0; }
    .status-title { margin: 0; font-size: 13.5px; line-height: 1.5; font-weight: 750; letter-spacing: -.035em; }
    .status-description { margin: 3px 0 0; font-size: 12px; line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere; }

    .primary-button {
      position: relative;
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      min-height: 70px;
      border: 0;
      border-radius: 19px;

      transition: transform 130ms ease, box-shadow 200ms ease, opacity 200ms ease;
    }
    .primary-button[data-variant=&quot;primary&quot;]:not(:disabled) { box-shadow: 0 8px 22px var(--cta-glow); }
    .primary-button:disabled { opacity: .78; }
    .cta-ico { position: relative; display: grid; place-items: center; width: 50px; height: 50px; border-radius: 15px; background: var(--yellow-ink); color: var(--yellow); flex: none; }

    .cta-txt small { font-size: 12px; line-height: 1.4; opacity: .68; letter-spacing: -.02em; }
    .cta-arrow { position: relative; width: 18px; height: 18px; opacity: .6; }
    .primary-button:disabled .cta-arrow { display: none; }
    .spinner { width: 20px; height: 20px; border: 2.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 900ms linear infinite; }
    /* 재시도·문의 같은 보조 동작은 차분한 색 */
    .primary-button[data-variant=&quot;secondary&quot;] { background: var(--soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
    .primary-button[data-variant=&quot;secondary&quot;] .cta-ico { background: var(--surface); color: var(--green-text); }

    /* 출발 준비 완료일 때만: 파동 + 빛 + 아이콘 숨쉬기 + 화살표 밀기 */
    .primary-button::after { content: &quot;&quot;; position: absolute; inset: 0; border-radius: inherit; border: 2px solid var(--yellow); opacity: 0; pointer-events: none; }
    .shine { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
    .shine::before { content: &quot;&quot;; position: absolute; top: 0; bottom: 0; left: -45%; width: 35%; background: linear-gradient(100deg, transparent, var(--shine), transparent); opacity: 0; transform: skewX(-20deg); }
    body[data-state=&quot;ready&quot;] .primary-button::after { animation: ring 2.2s ease-out .5s infinite; }
    body[data-state=&quot;ready&quot;] .shine::before { animation: sweep 3.4s ease-in-out 1s infinite; }
    body[data-state=&quot;ready&quot;] .cta-ico .icon { animation: breathe 2.2s ease-in-out .5s infinite; }
    body[data-state=&quot;ready&quot;] .cta-arrow { animation: nudge 1.4s ease-in-out infinite; }

    .help { margin: 4px 0 0; }
    .help summary { list-style: none; display: flex; align-items: center; justify-content: center; gap: 5px; min-height: 44px; padding: 10px 4px; font-size: 11.5px; color: var(--muted); cursor: pointer; }
    .help summary::-webkit-details-marker { display: none; }
    .help summary .icon { width: 13px; height: 13px; transition: transform 130ms ease; }
    .help[open] summary .icon { transform: rotate(180deg); }
    .help-content { padding: 13px 15px; border: 1px solid var(--line); border-radius: 14px; color: var(--muted); font-size: 12px; line-height: 1.8; }
    .help-content p { margin: 0; }
    .help-content p + p { margin-top: 6px; }

    /* ── 하단 서명 (시스템 담당) ── */
    .sig { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); scroll-margin: 24px; }
    .sig-k { display: block; margin-bottom: 3px; font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .sig-n { display: inline-flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 800; letter-spacing: .02em; }
    .sig-n::before { content: &quot;&quot;; width: 7px; height: 7px; border-radius: 2px; background: var(--yellow); transform: rotate(45deg); }
    .sig-act { display: flex; gap: 8px; }
    .ic { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); text-decoration: none; transition: transform 130ms ease, background 200ms, color 200ms, border-color 200ms; }
    .ic .icon { width: 18px; height: 18px; }
    .sig.attn .sig-k { color: var(--error-ink); }
    .sig.attn .ic.call { background: var(--call-bg); border-color: transparent; color: var(--call); }
    .sig.attn .ic.sms { background: var(--sms-bg); border-color: transparent; color: var(--sms); }
    .sig.flash .ic { animation: pop .45s ease-out 2; }

    .footer { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 20px 0 0; color: var(--muted); font-size: 10.5px; letter-spacing: -.015em; }
    .footer .icon { width: 13px; height: 13px; }

    .toast { position: fixed; z-index: 5; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); width: max-content; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 8px; padding: 12px 17px; border-radius: 15px; background: var(--toast); color: var(--page); font-size: 12.5px; line-height: 1.6; pointer-events: none; opacity: 0; transform: translate(-50%, 10px); transition: opacity 160ms ease, transform 160ms ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast .icon { width: 16px; height: 16px; }
    .no-script { border-radius: 16px; background: var(--error-bg); color: var(--error-ink); padding: 15px; margin: 0 0 16px; font-size: 13px; }
    .no-script p { margin: 0; }

    .theme-switch, .copy-button { transition: transform 130ms ease, opacity 130ms ease; }
    .theme-switch:active, .copy-button:active, .ic:active { transform: scale(.92); }
    .primary-button:active:not(:disabled) { transform: scale(.975); }
    @media (hover: hover) {
      .theme-switch:hover, .copy-button:hover, .primary-button:hover:not(:disabled), .ic:hover { opacity: .88; }
    }
    @media (min-width: 600px) { .page-shell { padding-top: 36px; padding-bottom: 32px; } .intro { margin-top: 32px; } }
    @media (max-width: 359px) {
      .page-shell { padding-left: 16px; padding-right: 16px; }
      .intro-title { font-size: 27px; }
      .destination { padding: 20px 18px 16px; }
      .destination h1 { font-size: 24px; }
      .cta-txt strong { font-size: 15px; }
    }

    @keyframes arrive { from { opacity: 0; transform: translateY(6px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes draw { from { transform: scaleY(.15); } to { transform: scaleY(1); } }
    @keyframes grow { from { transform: scaleY(0); } }
    @keyframes bob { 50% { transform: translateY(-5px); } }
    @keyframes drop { from { transform: translateY(-14px); opacity: 0; } }
    @keyframes ring { 0% { opacity: .8; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(1.05, 1.3); } }
    @keyframes sweep {
      0% { transform: translateX(0) skewX(-20deg); opacity: 1; }
      35% { transform: translateX(470%) skewX(-20deg); opacity: 1; }
      36%, 100% { transform: translateX(470%) skewX(-20deg); opacity: 0; }
    }
    @keyframes breathe { 50% { transform: scale(1.14) rotate(-8deg); } }
    @keyframes nudge { 50% { transform: translateX(4px); } }
    @keyframes pop { 50% { transform: scale(1.15); } }

    /* 폰에서 &#x27;동작 줄이기&#x27;를 켠 경우 모든 움직임 끔 */
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    /* 데이터 절약·메모리 2GB 이하 폰: 버튼 누름 효과 등은 그대로 두고, 계속 반복되는 장식만 끔 */
    .reduced-effects .shine::before,
    .reduced-effects .primary-button::after,
    .reduced-effects .cta-ico .icon,
    .reduced-effects .cta-arrow { animation: none !important; }
  &lt;/style&gt;
&lt;/head&gt;

        else showToast(&#x27;복사하지 못했어요. 주소를 길게 눌러 복사해 주세요.&#x27;, false, &#x27;alert&#x27;);
      });
    });

    /* ── 화면 기본값 ── */
    $(&#x27;destinationTitle&#x27;).textContent = placeName;
    $(&#x27;address&#x27;).textContent = address || &#x27;전달받은 위치로 안내합니다.&#x27;;
    $(&#x27;copyAddress&#x27;).hidden = !address;
    document.title = (placeName === &#x27;방문할 현장&#x27; ? &#x27;현장 길안내&#x27; : placeName + &#x27; · 현장 길안내&#x27;);
    $(&#x27;callButton&#x27;).href = &#x27;tel:&#x27; + CONFIG.phone;
    const smsBody = &#x27;[&#x27; + placeName + &#x27;] 길안내 관련 문의드립니다.&#x27;;
    $(&#x27;smsButton&#x27;).href = &#x27;sms:&#x27; + CONFIG.phone + (isIOS ? &#x27;&amp;&#x27; : &#x27;?&#x27;) + &#x27;body=&#x27; + encodeURIComponent(smsBody);
    document.querySelectorAll(&#x27;[data-contact]&#x27;).forEach(function (link) {
      link.addEventListener(&#x27;click&#x27;, function (event) {
        buzz();
        if (!PREVIEW) return;
        event.preventDefault();
        showToast(link.dataset.contact === &#x27;call&#x27; ? &#x27;미리보기 · 한명국님에게 전화 연결&#x27; : &#x27;미리보기 · 현장명이 담긴 문자창 열기&#x27;);
      });
    });

    /* ── 상태별 화면 정의 ── */
    const STATES = {
      loading:     { tag: &#x27;확인 중&#x27;,   title: &#x27;목적지를 확인하고 있어요&#x27;, detail: &#x27;잠시만 기다려 주세요.&#x27;, icon: &#x27;clock&#x27;, cta: &#x27;길안내 준비 중&#x27;, sub: &#x27;목적지 위치를 확인하고 있어요&#x27;, action: &#x27;wait&#x27; },
      ready:       { tag: &#x27;방문 장소&#x27;, cta: &#x27;카카오내비로 출발하기&#x27;, sub: &#x27;누르면 카카오내비가 열려요&#x27;, action: &#x27;navigate&#x27;, buttonIcon: &#x27;go&#x27; },
      opening:     { tag: &#x27;방문 장소&#x27;, title: &#x27;카카오내비에 연결하고 있어요&#x27;, detail: &#x27;앱이 열리지 않으면 버튼을 다시 눌러 주세요.&#x27;, icon: &#x27;go&#x27;, cta: &#x27;카카오내비 다시 열기&#x27;, sub: &#x27;한 번 더 눌러도 괜찮아요&#x27;, action: &#x27;navigate&#x27;, buttonIcon: &#x27;go&#x27; },
      notfound:    { tag: &#x27;주소 확인&#x27;, title: &#x27;주소를 확인할 수 없어요&#x27;, detail: &#x27;전달받은 주소를 확인하거나 시스템 담당자에게 문의해 주세요.&#x27;, icon: &#x27;pin&#x27;, tone: &#x27;error&#x27;, cta: &#x27;주소 다시 확인하기&#x27;, sub: &#x27;한 번 더 검색해 볼게요&#x27;, action: &#x27;retry&#x27; },

      timeout:     { tag: &#x27;응답 지연&#x27;, title: &#x27;연결이 조금 늦어지고 있어요&#x27;, detail: &#x27;인터넷 연결을 확인한 뒤 다시 시도해 주세요.&#x27;, icon: &#x27;clock&#x27;, tone: &#x27;error&#x27;, cta: &#x27;다시 시도하기&#x27;, sub: &#x27;목적지를 다시 불러와요&#x27;, action: &#x27;retry&#x27; },

      missing:     { tag: &#x27;정보 필요&#x27;, title: &#x27;링크에 목적지가 없어요&#x27;, detail: &#x27;주소가 포함된 안내 링크를 다시 받으면 바로 출발할 수 있어요.&#x27;, icon: &#x27;pin&#x27;, tone: &#x27;error&#x27;, cta: &#x27;담당자에게 문의하기&#x27;, sub: &#x27;아래 연락 버튼으로 이동해요&#x27;, action: &#x27;contact&#x27;, buttonIcon: &#x27;message&#x27; },
      invalid:     { tag: &#x27;위치 확인&#x27;, title: &#x27;목적지 위치가 올바르지 않아요&#x27;, detail: &#x27;정확한 위치가 담긴 링크를 다시 요청해 주세요.&#x27;, icon: &#x27;pin&#x27;, tone: &#x27;error&#x27;, cta: &#x27;담당자에게 문의하기&#x27;, sub: &#x27;아래 연락 버튼으로 이동해요&#x27;, action: &#x27;contact&#x27;, buttonIcon: &#x27;message&#x27; },
      desktop:     { tag: &#x27;방문 장소&#x27;, title: &#x27;길안내는 휴대폰에서 시작해 주세요&#x27;, detail: &#x27;이 페이지의 링크를 휴대폰으로 보내 열어 주세요.&#x27;, icon: &#x27;desktop&#x27;, cta: &#x27;안내 링크 복사하기&#x27;, sub: &#x27;휴대폰으로 보내서 열어 주세요&#x27;, action: &#x27;copylink&#x27;, buttonIcon: &#x27;copy&#x27; },
      launcherror: { tag: &#x27;방문 장소&#x27;, title: &#x27;카카오내비를 열지 못했어요&#x27;, detail: &#x27;앱 설치 여부를 확인한 뒤 다시 눌러 주세요.&#x27;, icon: &#x27;alert&#x27;, tone: &#x27;error&#x27;, cta: &#x27;카카오내비 다시 열기&#x27;, sub: &#x27;앱 설치 후 다시 눌러 주세요&#x27;, action: &#x27;navigate&#x27;, buttonIcon: &#x27;go&#x27; }
    };

    function renderState(state) {
      const model = STATES[state] || STATES.sdkerror;
      currentState = STATES[state] ? state : &#x27;sdkerror&#x27;;
      const fail = model.tone === &#x27;error&#x27; &amp;&amp; currentState !== &#x27;launcherror&#x27;;
      document.body.dataset.state = currentState;
      document.body.dataset.phase = currentState === &#x27;loading&#x27; ? &#x27;loading&#x27; : (fail ? &#x27;fail&#x27; : &#x27;ok&#x27;);
      $(&#x27;destination&#x27;).setAttribute(&#x27;aria-busy&#x27;, String(currentState === &#x27;loading&#x27;));
      $(&#x27;destinationTag&#x27;).textContent = model.tag;

      $(&#x27;statusPanel&#x27;).hidden = !model.title;
      $(&#x27;statusPanel&#x27;).dataset.tone = model.tone || &#x27;info&#x27;;
      $(&#x27;statusTitle&#x27;).textContent = model.title || &#x27;&#x27;;
      $(&#x27;statusDescription&#x27;).textContent = model.detail || &#x27;&#x27;;
      setIcon(&#x27;statusIcon&#x27;, model.icon || &#x27;alert&#x27;);

      const btn = $(&#x27;primaryButton&#x27;);
      $(&#x27;primaryText&#x27;).textContent = model.cta;
      $(&#x27;primarySub&#x27;).textContent = model.sub || &#x27;&#x27;;
      btn.disabled = model.action === &#x27;wait&#x27;;
      btn.dataset.variant = (model.action === &#x27;navigate&#x27; || model.action === &#x27;wait&#x27;) ? &#x27;primary&#x27; : &#x27;secondary&#x27;;
      $(&#x27;primarySpinner&#x27;).hidden = currentState !== &#x27;loading&#x27;;
      $(&#x27;primaryIconWrap&#x27;).toggleAttribute(&#x27;hidden&#x27;, currentState === &#x27;loading&#x27;);
      setIcon(&#x27;primaryIcon&#x27;, model.buttonIcon || &#x27;refresh&#x27;);
      $(&#x27;primaryIconWrap&#x27;).classList.toggle(&#x27;fill&#x27;, (model.buttonIcon || &#x27;&#x27;) === &#x27;go&#x27;);

      const attn = model.tone === &#x27;error&#x27; || model.action === &#x27;contact&#x27;;
      $(&#x27;contact&#x27;).classList.toggle(&#x27;attn&#x27;, attn);
      $(&#x27;sigK&#x27;).textContent = attn ? &#x27;문의 · System by&#x27; : &#x27;System by&#x27;;

      $(&#x27;help&#x27;).hidden = [&#x27;ready&#x27;, &#x27;opening&#x27;, &#x27;launcherror&#x27;, &#x27;desktop&#x27;].indexOf(currentState) === -1;
      if (currentState === &#x27;missing&#x27;) {
        $(&#x27;destinationTitle&#x27;).textContent = &#x27;목적지 정보가 없어요&#x27;;
        $(&#x27;address&#x27;).textContent = &#x27;받으신 링크에 목적지가 포함되어 있지 않아요.&#x27;;
      }
      if (currentState === &#x27;invalid&#x27; &amp;&amp; !address) $(&#x27;address&#x27;).textContent = &#x27;전달받은 위치를 확인할 수 없어요.&#x27;;
      announceHeight();
    }

    function validCoordinates(x, y) {
      return Number.isFinite(x) &amp;&amp; Number.isFinite(y) &amp;&amp; x &gt;= -180 &amp;&amp; x &lt;= 180 &amp;&amp; y &gt;= -90 &amp;&amp; y &lt;= 90;
    }
    function displayCoordinates() {
      if (!address &amp;&amp; coordinates) {
        $(&#x27;coordinates&#x27;).textContent = &#x27;위도 &#x27; + coordinates.y.toFixed(5) + &#x27; · 경도 &#x27; + coordinates.x.toFixed(5);
        $(&#x27;coordinates&#x27;).hidden = false;
      }
    }

    function startNavi() {
      if (launchCooldown || !coordinates) return;
      launchCooldown = true;
      setTimeout(function () { launchCooldown = false; }, 900);
      if (PREVIEW) { renderState(&#x27;opening&#x27;); return; }
      if (!isMobile) { renderState(&#x27;desktop&#x27;); return; }
      try {
        if (!window.Kakao || !Kakao.Navi || !Kakao.isInitialized()) throw new Error(&#x27;Kakao Navi is not initialized&#x27;);
        Kakao.Navi.start({ name: placeName, x: coordinates.x, y: coordinates.y, coordType: &#x27;wgs84&#x27; });
        renderState(&#x27;opening&#x27;);
      } catch (error) {
        console.warn(&#x27;[현장 길안내] 앱 연결 실패&#x27;, error);
        renderState(&#x27;launcherror&#x27;);
      }
    }

    $(&#x27;primaryButton&#x27;).addEventListener(&#x27;click&#x27;, function () {
      const action = STATES[currentState].action;
      buzz();
      if (action === &#x27;navigate&#x27;) startNavi();
      if (action === &#x27;retry&#x27;) {
        if (PREVIEW) {
          renderState(&#x27;loading&#x27;);
          clearTimeout(previewTimer);
          previewTimer = setTimeout(function () { renderState(&#x27;ready&#x27;); }, 900);
        } else resolveDestination();
      }
      if (action === &#x27;contact&#x27;) {
        const sig = $(&#x27;contact&#x27;);
        sig.scrollIntoView({ behavior: &#x27;auto&#x27;, block: &#x27;center&#x27; });
        sig.classList.remove(&#x27;flash&#x27;); void sig.offsetWidth; sig.classList.add(&#x27;flash&#x27;);
        $(&#x27;callButton&#x27;).focus({ preventScroll: true });
      }
      if (action === &#x27;copylink&#x27;) {
        copyText(location.href).then(function (ok) { showToast(ok ? &#x27;안내 링크를 복사했어요&#x27; : &#x27;주소창의 링크를 복사해 주세요.&#x27;, false, ok ? &#x27;check&#x27; : &#x27;alert&#x27;); });
      }
    });
    $(&#x27;help&#x27;).addEventListener(&#x27;toggle&#x27;, announceHeight);

    /* ── 카카오 SDK는 화면을 먼저 보여준 뒤 비동기로 불러옵니다 ── */
    function loadScript(id, src) {
      if (scriptPromises[id]) return scriptPromises[id];
      scriptPromises[id] = new Promise(function (resolve, reject) {
        const previous = document.getElementById(id);
        if (previous) previous.remove();
        const script = document.createElement(&#x27;script&#x27;);
        script.id = id;
        script.async = true;
        script.src = src;
        let settled = false;
        let timer;
        function finish(ok) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          script.onload = script.onerror = null;
          if (ok) resolve();
          else { script.remove(); delete scriptPromises[id]; reject(new Error(&#x27;SDK load failed: &#x27; + id)); }
        }
        script.onload = function () { finish(true); };
        script.onerror = function () { finish(false); };
        timer = setTimeout(function () { finish(false); }, CONFIG.timeoutMs - 1000);
        document.head.appendChild(script);
      });
      return scriptPromises[id];
    }
    function loadNaviSDK() {
      const loaded = window.Kakao &amp;&amp; window.Kakao.Navi ? Promise.resolve() : loadScript(&#x27;kakao-navi-sdk&#x27;, CONFIG.sdkUrl);
      return loaded.then(function () {
        if (!window.Kakao || !Kakao.Navi) { delete scriptPromises[&#x27;kakao-navi-sdk&#x27;]; throw new Error(&#x27;Kakao Navi SDK unavailable&#x27;); }
        if (!Kakao.isInitialized()) Kakao.init(CONFIG.jsKey);
        if (!Kakao.isInitialized()) throw new Error(&#x27;Kakao initialization failed&#x27;);
      });
    }
    function loadMapServices() {
      if (window.kakao &amp;&amp; kakao.maps &amp;&amp; kakao.maps.services) return Promise.resolve();
      return loadScript(&#x27;kakao-map-sdk&#x27;, &#x27;https://dapi.kakao.com/v2/maps/sdk.js?appkey=&#x27; + encodeURIComponent(CONFIG.jsKey) + &#x27;&amp;libraries=services&amp;autoload=false&#x27;).then(function () {
        return new Promise(function (resolve, reject) {
          if (!window.kakao || !kakao.maps || !kakao.maps.load) { delete scriptPromises[&#x27;kakao-map-sdk&#x27;]; reject(new Error(&#x27;Kakao maps SDK unavailable&#x27;)); return; }
          kakao.maps.load(function () {
            if (kakao.maps.services) resolve();
            else { delete scriptPromises[&#x27;kakao-map-sdk&#x27;]; reject(new Error(&#x27;Kakao map services unavailable&#x27;)); }
          });
        });
      });
    }

    function resolveDestination() {
      const token = ++requestId;
      clearTimeout(requestTimer);
      coordinates = null;
      if (rawLat &amp;&amp; rawLng) {
        const x = Number(rawLng), y = Number(rawLat);
        if (!validCoordinates(x, y)) { renderState(&#x27;invalid&#x27;); return; }
        coordinates = { x: x, y: y };
      } else if (!address) {
        renderState(rawLat || rawLng ? &#x27;invalid&#x27; : &#x27;missing&#x27;);
        return;
      }
      if (navigator.onLine === false) { renderState(&#x27;offline&#x27;); return; }
      renderState(&#x27;loading&#x27;);
      requestTimer = setTimeout(function () {
        if (token !== requestId) return;
        requestId++;
        renderState(navigator.onLine === false ? &#x27;offline&#x27; : &#x27;timeout&#x27;);
      }, CONFIG.timeoutMs);
      function fail(state, error) {
        if (token !== requestId) return;
        clearTimeout(requestTimer);
        if (error) console.warn(&#x27;[현장 길안내] 연결 오류&#x27;, error);
        renderState(navigator.onLine === false ? &#x27;offline&#x27; : state);
      }
      function ready(x, y) {
        if (token !== requestId) return;
        clearTimeout(requestTimer);
        x = Number(x); y = Number(y);
        if (!validCoordinates(x, y)) { fail(&#x27;notfound&#x27;); return; }
        coordinates = { x: x, y: y };
        displayCoordinates();
        renderState(isMobile ? &#x27;ready&#x27; : &#x27;desktop&#x27;);
        /* 휴대폰에서 처음 준비되면 카카오내비를 1회 자동 실행 */
        if (isMobile &amp;&amp; CONFIG.autoOpen &amp;&amp; !autoOpened) { autoOpened = true; startNavi(); }
      }
      function searchAddress() {
        if (token !== requestId) return;
        try {
          const services = kakao.maps.services;
          new services.Geocoder().addressSearch(address, function (results, status) {
            if (token !== requestId) return;
            if (status === services.Status.OK &amp;&amp; results &amp;&amp; results.length) { ready(results[0].x, results[0].y); return; }
            if (status !== services.Status.ZERO_RESULT) { fail(&#x27;sdkerror&#x27;); return; }
            /* 주소로 못 찾으면 장소명(키워드)으로 한 번 더 검색 */
            try {
              new services.Places().keywordSearch(address, function (places, placeStatus) {
                if (token !== requestId) return;
                if (placeStatus === services.Status.OK &amp;&amp; places &amp;&amp; places.length) ready(places[0].x, places[0].y);
                else fail(placeStatus === services.Status.ZERO_RESULT ? &#x27;notfound&#x27; : &#x27;sdkerror&#x27;);
              });
            } catch (error) { fail(&#x27;sdkerror&#x27;, error); }
          });
        } catch (error) { fail(&#x27;sdkerror&#x27;, error); }
      }
      if (coordinates) {
        const supplied = coordinates;
        loadNaviSDK().then(function () { ready(supplied.x, supplied.y); }).catch(function (error) { fail(&#x27;sdkerror&#x27;, error); });
      } else {
        Promise.all([loadNaviSDK(), loadMapServices()]).then(searchAddress).catch(function (error) { fail(&#x27;sdkerror&#x27;, error); });
      }
    }

    document.addEventListener(&#x27;visibilitychange&#x27;, function () {
      /* 카카오내비에서 돌아오면 &#x27;연결 중&#x27; 안내 대신 출발 화면으로 */
      if (!PREVIEW &amp;&amp; !document.hidden &amp;&amp; currentState === &#x27;opening&#x27;) renderState(&#x27;ready&#x27;);
    });
    window.addEventListener(&#x27;offline&#x27;, function () {
      if (PREVIEW || [&#x27;missing&#x27;, &#x27;invalid&#x27;].indexOf(currentState) !== -1) return;
      ++requestId;
      clearTimeout(requestTimer);
      renderState(&#x27;offline&#x27;);
    });
    window.addEventListener(&#x27;online&#x27;, function () {
      if (!PREVIEW &amp;&amp; currentState === &#x27;offline&#x27;) showToast(&#x27;인터넷에 연결됐어요. 다시 시도해 주세요.&#x27;);
    });

    if (PREVIEW) {
      const requested = PREVIEW.state || &#x27;ready&#x27;;
      renderState([&#x27;copied&#x27;, &#x27;longtext&#x27;, &#x27;coordinates&#x27;].indexOf(requested) !== -1 ? &#x27;ready&#x27; : requested);
      if (requested === &#x27;coordinates&#x27;) displayCoordinates();
      if (requested === &#x27;copied&#x27;) copiedFeedback(true);
      if (window.ResizeObserver) new ResizeObserver(announceHeight).observe(document.querySelector(&#x27;.page-shell&#x27;));
      announceHeight();
    } else resolveDestination();
  })();

  &lt;title&gt;현장 길안내&lt;/title&gt;

  &lt;style&gt;
    /* 저사양 폰 배려: 시스템 글꼴 + 인라인 SVG만 사용. 웹폰트·이미지·블러 없음.

    :root {

      --surface: #ffffff;

      --muted: #64736c;
      --line: #dfe5dc;
      --soft: #edf1e9;
      --green-text: #28624f;
      --hero: #1f4a3e;

      --shine: rgba(255, 255, 255, .7);
      --notice: #edf2e9;
      --notice-ink: #365c48;
      --error-bg: #fbefea;
      --error-ink: #95482e;

    :root[data-theme=&quot;dark&quot;] {
      color-scheme: dark;
      --page: #141d19;
      --surface: #1e2a23;
      --ink: #edf1e8;
      --muted: #acb9ad;
      --line: #35453a;
      --soft: #2b3b2f;
      --green-text: #c0dabb;
      --hero: #264e40;
      --hero-ink: #f7faf2;
      --hero-muted: #d1e1d6;
      --hero-line: rgba(255, 255, 255, .14);
      --cta-glow: rgba(254, 229, 0, .14);
      --shine: rgba(255, 255, 255, .6);
      --notice: #283b2d;
      --notice-ink: #c2d7b7;
      --error-bg: #3c2c25;
      --error-ink: #f3b59d;
      --focus: #c7dfa9;
      --disabled: #2c3a2f;
      --disabled-ink: #b8c4b5;
      --toast: #e8efd9;
      --call: #9ad8ae;
      --call-bg: #24392b;
      --sms: #abc4f3;
      --sms-bg: #24304a;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { min-width: 280px; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, &quot;Noto Sans CJK KR&quot;, &quot;Noto Sans KR&quot;, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, a, summary { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; cursor: pointer; }
    button:disabled { cursor: default; }
    button, a { touch-action: manipulation; }
    a { color: inherit; }
    button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
    svg { display: block; flex: none; }
    .icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon.fill { fill: currentColor; stroke: none; }
    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

    /* ── 페이지 ── */
    .page-shell {
      width: 100%;
      max-width: 464px;
      margin: 0 auto;
      padding: calc(20px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));
      animation: arrive 260ms ease-out both;
    }
    .app-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 750; letter-spacing: -.035em; }
    .brand-mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: var(--ink); color: var(--page); }
    .brand-mark .icon { width: 19px; height: 19px; }
    .theme-switch { display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--ink); }
    .theme-switch .icon { width: 18px; height: 18px; }

    .intro { margin: 26px 0 20px; }
    .eyebrow { margin: 0 0 8px; font-size: 11px; font-weight: 650; color: var(--muted); letter-spacing: .06em; }
    .intro-title { margin: 0; font-size: 30px; line-height: 1.28; font-weight: 800; letter-spacing: -.065em; word-break: keep-all; }
    .intro-title span { color: var(--green-text); }
    .intro-description { margin: 8px 0 0; font-size: 13px; line-height: 1.6; color: var(--muted); letter-spacing: -.03em; }

    /* ── 목적지 카드: 현재 위치 → 도착지 경로 ── */
    .destination {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: 22px 22px 18px;
      border-radius: var(--radius);
      background: var(--hero);
      color: var(--hero-ink);
    }
    .route-art { position: absolute; top: 0; right: 0; width: 142px; height: 122px; color: #9cc4a6; opacity: .2; z-index: -1; pointer-events: none; }
    .destination-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .destination-label { display: flex; align-items: center; gap: 7px; margin: 0; color: var(--hero-muted); font-size: 12px; font-weight: 650; }
    .destination-label .icon { width: 16px; height: 16px; }
    .destination-tag { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--hero-line); border-radius: 20px; padding: 4px 10px; font-size: 10.5px; font-weight: 650; color: var(--hero-muted); line-height: 1.4; }
    .destination-tag::before { content: &quot;&quot;; width: 5px; height: 5px; background: var(--yellow); border-radius: 50%; }

    .trip { display: grid; grid-template-columns: 24px minmax(0, 1fr); column-gap: 13px; align-items: center; margin-bottom: 20px; }
    .from-dot { justify-self: center; width: 13px; height: 13px; border-radius: 50%; border: 2.5px solid var(--hero-muted); }
    .from-text { margin: 0; font-size: 13px; font-weight: 600; color: var(--hero-muted); }
    .rail { justify-self: center; width: 3px; height: 38px; margin: 7px 0; border-radius: 3px; background: var(--yellow); transform-origin: top; }
    .trip .pin { justify-self: center; align-self: start; margin-top: 5px; width: 22px; height: 28px; color: var(--yellow); }
    .trip .pin .dot { fill: var(--hero); }
    .destination h1 { margin: 0; font-size: 27px; font-weight: 800; line-height: 1.38; letter-spacing: -.055em; word-break: keep-all; overflow-wrap: anywhere; }

    .address-block { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--hero-line); padding-top: 15px; }
    .address-text { flex: 1; min-width: 0; }
    .address { margin: 0; color: var(--hero-muted); font-size: 13.5px; line-height: 1.7; letter-spacing: -.015em; word-break: keep-all; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
    .coordinates { margin: 3px 0 0; color: var(--hero-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .copy-button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; flex: none; min-width: 48px; min-height: 48px; border: 1px solid var(--hero-line); border-radius: 13px; padding: 6px; background: transparent; color: var(--hero-ink); font-size: 9.5px; line-height: 1.4; }
    .copy-button .icon { width: 16px; height: 16px; }

    /* 경로 움직임: 찾는 중엔 선이 늘었다 줄고, 찾으면 선이 그어진 뒤 핀이 떨어짐 */
    body[data-phase=&quot;loading&quot;] .rail { animation: draw 1.1s ease-in-out infinite alternate; }
    body[data-phase=&quot;loading&quot;] .trip .pin { animation: bob 1.1s ease-in-out infinite; }
    body[data-phase=&quot;ok&quot;] .rail { animation: grow .5s ease-out both; }
    body[data-phase=&quot;ok&quot;] .trip .pin { animation: drop .45s cubic-bezier(.3, 1.5, .5, 1) .35s both; }
    body[data-phase=&quot;fail&quot;] .rail, body[data-phase=&quot;fail&quot;] .trip .pin { opacity: .3; }

    /* ── 상태 안내 + 출발 버튼 ── */
    .navigation { margin-top: 14px; }
    .status-panel { display: flex; align-items: flex-start; gap: 10px; background: var(--notice); color: var(--notice-ink); border-radius: 16px; padding: 14px 15px; margin: 0 0 12px; animation: arrive .22s ease-out both; }
    .status-panel[data-tone=&quot;error&quot;] { background: var(--error-bg); color: var(--error-ink); }
    .status-panel &gt; .icon { width: 18px; height: 18px; margin-top: 2px; }
    .status-copy { min-width: 0; }
    .status-title { margin: 0; font-size: 13.5px; line-height: 1.5; font-weight: 750; letter-spacing: -.035em; }
    .status-description { margin: 3px 0 0; font-size: 12px; line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere; }

    .primary-button {
      position: relative;
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      min-height: 70px;
      border: 0;
      border-radius: 19px;
      padding: 10px 18px 10px 10px;
      background: var(--yellow);
      color: var(--yellow-ink);
      text-align: left;
      transition: transform 130ms ease, box-shadow 200ms ease, opacity 200ms ease;
    }
    .primary-button[data-variant=&quot;primary&quot;]:not(:disabled) { box-shadow: 0 8px 22px var(--cta-glow); }
    .primary-button:disabled { opacity: .78; }
    .cta-ico { position: relative; display: grid; place-items: center; width: 50px; height: 50px; border-radius: 15px; background: var(--yellow-ink); color: var(--yellow); flex: none; }
    .cta-ico .icon { width: 22px; height: 22px; }
    .cta-txt { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .cta-txt strong { font-size: 16.5px; font-weight: 800; line-height: 1.35; letter-spacing: -.045em; overflow-wrap: anywhere; }
    .cta-txt small { font-size: 12px; line-height: 1.4; opacity: .68; letter-spacing: -.02em; }
    .cta-arrow { position: relative; width: 18px; height: 18px; opacity: .6; }
    .primary-button:disabled .cta-arrow { display: none; }
    .spinner { width: 20px; height: 20px; border: 2.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 900ms linear infinite; }
    /* 재시도·문의 같은 보조 동작은 차분한 색 */
    .primary-button[data-variant=&quot;secondary&quot;] { background: var(--soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
    .primary-button[data-variant=&quot;secondary&quot;] .cta-ico { background: var(--surface); color: var(--green-text); }

    /* 출발 준비 완료일 때만: 파동 + 빛 + 아이콘 숨쉬기 + 화살표 밀기 */
    .primary-button::after { content: &quot;&quot;; position: absolute; inset: 0; border-radius: inherit; border: 2px solid var(--yellow); opacity: 0; pointer-events: none; }
    .shine { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
    .shine::before { content: &quot;&quot;; position: absolute; top: 0; bottom: 0; left: -45%; width: 35%; background: linear-gradient(100deg, transparent, var(--shine), transparent); opacity: 0; transform: skewX(-20deg); }
    body[data-state=&quot;ready&quot;] .primary-button::after { animation: ring 2.2s ease-out .5s infinite; }
    body[data-state=&quot;ready&quot;] .shine::before { animation: sweep 3.4s ease-in-out 1s infinite; }
    body[data-state=&quot;ready&quot;] .cta-ico .icon { animation: breathe 2.2s ease-in-out .5s infinite; }
    body[data-state=&quot;ready&quot;] .cta-arrow { animation: nudge 1.4s ease-in-out infinite; }

    .help { margin: 4px 0 0; }
    .help summary { list-style: none; display: flex; align-items: center; justify-content: center; gap: 5px; min-height: 44px; padding: 10px 4px; font-size: 11.5px; color: var(--muted); cursor: pointer; }
    .help summary::-webkit-details-marker { display: none; }
    .help summary .icon { width: 13px; height: 13px; transition: transform 130ms ease; }
    .help[open] summary .icon { transform: rotate(180deg); }
    .help-content { padding: 13px 15px; border: 1px solid var(--line); border-radius: 14px; color: var(--muted); font-size: 12px; line-height: 1.8; }
    .help-content p { margin: 0; }
    .help-content p + p { margin-top: 6px; }

    /* ── 하단 서명 (시스템 담당) ── */
    .sig { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); scroll-margin: 24px; }
    .sig-k { display: block; margin-bottom: 3px; font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .sig-n { display: inline-flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 800; letter-spacing: .02em; }
    .sig-n::before { content: &quot;&quot;; width: 7px; height: 7px; border-radius: 2px; background: var(--yellow); transform: rotate(45deg); }
    .sig-act { display: flex; gap: 8px; }
    .ic { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); text-decoration: none; transition: transform 130ms ease, background 200ms, color 200ms, border-color 200ms; }
    .ic .icon { width: 18px; height: 18px; }
    .sig.attn .sig-k { color: var(--error-ink); }
    .sig.attn .ic.call { background: var(--call-bg); border-color: transparent; color: var(--call); }
    .sig.attn .ic.sms { background: var(--sms-bg); border-color: transparent; color: var(--sms); }
    .sig.flash .ic { animation: pop .45s ease-out 2; }

    .footer { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 20px 0 0; color: var(--muted); font-size: 10.5px; letter-spacing: -.015em; }
    .footer .icon { width: 13px; height: 13px; }

    .toast { position: fixed; z-index: 5; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); width: max-content; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 8px; padding: 12px 17px; border-radius: 15px; background: var(--toast); color: var(--page); font-size: 12.5px; line-height: 1.6; pointer-events: none; opacity: 0; transform: translate(-50%, 10px); transition: opacity 160ms ease, transform 160ms ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast .icon { width: 16px; height: 16px; }
    .no-script { border-radius: 16px; background: var(--error-bg); color: var(--error-ink); padding: 15px; margin: 0 0 16px; font-size: 13px; }
    .no-script p { margin: 0; }

    .theme-switch, .copy-button { transition: transform 130ms ease, opacity 130ms ease; }
    .theme-switch:active, .copy-button:active, .ic:active { transform: scale(.92); }
    .primary-button:active:not(:disabled) { transform: scale(.975); }
    @media (hover: hover) {
      .theme-switch:hover, .copy-button:hover, .primary-button:hover:not(:disabled), .ic:hover { opacity: .88; }
    }
    @media (min-width: 600px) { .page-shell { padding-top: 36px; padding-bottom: 32px; } .intro { margin-top: 32px; } }
    @media (max-width: 359px) {

      .intro-title { font-size: 27px; }
      .destination { padding: 20px 18px 16px; }
      .destination h1 { font-size: 24px; }
      .cta-txt strong { font-size: 15px; }
    }

    @keyframes arrive { from { opacity: 0; transform: translateY(6px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes draw { from { transform: scaleY(.15); } to { transform: scaleY(1); } }
    @keyframes grow { from { transform: scaleY(0); } }
    @keyframes bob { 50% { transform: translateY(-5px); } }
    @keyframes drop { from { transform: translateY(-14px); opacity: 0; } }
    @keyframes ring { 0% { opacity: .8; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(1.05, 1.3); } }
    @keyframes sweep {

      35% { transform: translateX(470%) skewX(-20deg); opacity: 1; }
      36%, 100% { transform: translateX(470%) skewX(-20deg); opacity: 0; }
    }
    @keyframes breathe { 50% { transform: scale(1.14) rotate(-8deg); } }
    @keyframes nudge { 50% { transform: translateX(4px); } }
    @keyframes pop { 50% { transform: scale(1.15); } }

    /* 폰에서 &#x27;동작 줄이기&#x27;를 켠 경우 모든 움직임 끔 */
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    /* 데이터 절약·메모리 2GB 이하 폰: 버튼 누름 효과 등은 그대로 두고, 계속 반복되는 장식만 끔 */
    .reduced-effects .shine::before,
    .reduced-effects .primary-button::after,
    .reduced-effects .cta-ico .icon,
    .reduced-effects .cta-arrow { animation: none !important; }
  &lt;/style&gt;

  &lt;script&gt;
  (function () {
    &#x27;use strict&#x27;;
    /* ── 운영 설정 ──────────────────────────────────────────────────
       ▼ 여기만 바꾸세요: 카카오디벨로퍼스 [앱] &gt; [플랫폼 키] &gt; [JavaScript 키]

    const CONFIG = {

    };
    /* preview.html이 주입하는 미리보기 값. 실제 링크에서는 비어 있음 (SDK·전화·문자 호출 안 함). */
    const PREVIEW = window.__NAVI_PREVIEW__ || null;
    const $ = function (id) { return document.getElementById(id); };
    const q = new URLSearchParams(location.search);
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === &#x27;MacIntel&#x27; &amp;&amp; navigator.maxTouchPoints &gt; 1);
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || isIOS;
    const rawLat = (q.get(&#x27;lat&#x27;) || &#x27;&#x27;).trim();

    let address = (q.get(&#x27;addr&#x27;) || &#x27;&#x27;).trim();
    let placeName = (q.get(&#x27;name&#x27;) || &#x27;&#x27;).trim() || address || &#x27;방문할 현장&#x27;;
    let currentState = &#x27;loading&#x27;;
    let coordinates = null;
    let requestId = 0;
    let requestTimer, toastTimer, copyTimer, previewTimer;
    let autoOpened = false;
    let launchCooldown = false;
    const scriptPromises = {};

    if (PREVIEW) {
      placeName = PREVIEW.name || &#x27;천호동 방역현장&#x27;;
      address = PREVIEW.addr === undefined ? &#x27;서울특별시 강동구 천중로39길 55&#x27; : PREVIEW.addr;
      coordinates = { x: 127.1388, y: 37.5442 };
      if (PREVIEW.state === &#x27;missing&#x27;) { placeName = &#x27;방문할 현장&#x27;; address = &#x27;&#x27;; coordinates = null; }
      if (PREVIEW.state === &#x27;coordinates&#x27;) address = &#x27;&#x27;;
      if (PREVIEW.state === &#x27;longtext&#x27;) {
        placeName = &#x27;강동구 천호동 공동주택 정기 방역 및 소독 작업 제2현장&#x27;;

      }
    }

    if ((navigator.connection &amp;&amp; navigator.connection.saveData) || (navigator.deviceMemory &amp;&amp; navigator.deviceMemory &lt;= 2)) {
      document.documentElement.classList.add(&#x27;reduced-effects&#x27;);
    }

    function setIcon(id, icon) { $(id).setAttribute(&#x27;href&#x27;, &#x27;#i-&#x27; + icon); }
    function announceHeight() {
      if (PREVIEW &amp;&amp; window.parent !== window) {

      }
    }

    /* ── 테마 전환 ── */
    function updateTheme() {
      const dark = document.documentElement.dataset.theme === &#x27;dark&#x27;;
      $(&#x27;themeSwitch&#x27;).setAttribute(&#x27;aria-pressed&#x27;, String(dark));
      $(&#x27;themeSwitch&#x27;).setAttribute(&#x27;aria-label&#x27;, dark ? &#x27;밝은 화면으로 변경&#x27; : &#x27;어두운 화면으로 변경&#x27;);

      setIcon(&#x27;themeIcon&#x27;, dark ? &#x27;sun&#x27; : &#x27;moon&#x27;);
    }

    updateTheme();

    /* ── 토스트 / 복사 ── */
    function buzz() { try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {} }
    function showToast(message, hold, icon) {
      clearTimeout(toastTimer);
      setIcon(&#x27;toastIcon&#x27;, icon || &#x27;check&#x27;);
      $(&#x27;toastText&#x27;).textContent = message;
      $(&#x27;toast&#x27;).classList.add(&#x27;show&#x27;);
      if (!hold) toastTimer = setTimeout(function () { $(&#x27;toast&#x27;).classList.remove(&#x27;show&#x27;); }, 3200);
    }
    function legacyCopy(text) {
      const active = document.activeElement;
      const ta = document.createElement(&#x27;textarea&#x27;);
      ta.value = text;
      ta.setAttribute(&#x27;readonly&#x27;, &#x27;&#x27;);
      ta.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
      ta.tabIndex = -1;
      ta.style.cssText = &#x27;position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;font-size:16px&#x27;;
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      let copied = false;
      try { copied = document.execCommand(&#x27;copy&#x27;); } catch (e) {}
      ta.remove();
      if (active &amp;&amp; active.focus) { try { active.focus({ preventScroll: true }); } catch (e) { active.focus(); } }
      return copied;
    }
    function copyText(text) {
      if (PREVIEW) return Promise.resolve(true);
      if (navigator.clipboard &amp;&amp; window.isSecureContext) {
        return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacyCopy(text); });
      }
      return Promise.resolve(legacyCopy(text));
    }
    function copiedFeedback(hold) {
      clearTimeout(copyTimer);
      setIcon(&#x27;copyIcon&#x27;, &#x27;check&#x27;);
      $(&#x27;copyLabel&#x27;).textContent = &#x27;복사 완료&#x27;;

    }
    $(&#x27;copyAddress&#x27;).addEventListener(&#x27;click&#x27;, function () {
      if (!address) return;
      buzz();
      copyText(address).then(function (ok) {
        if (ok) copiedFeedback(false);
        else showToast(&#x27;복사하지 못했어요. 주소를 길게 눌러 복사해 주세요.&#x27;, false, &#x27;alert&#x27;);

    });

    /* ── 화면 기본값 ── */
    $(&#x27;destinationTitle&#x27;).textContent = placeName;
    $(&#x27;address&#x27;).textContent = address || &#x27;전달받은 위치로 안내합니다.&#x27;;
    $(&#x27;copyAddress&#x27;).hidden = !address;
    document.title = (placeName === &#x27;방문할 현장&#x27; ? &#x27;현장 길안내&#x27; : placeName + &#x27; · 현장 길안내&#x27;);
    $(&#x27;callButton&#x27;).href = &#x27;tel:&#x27; + CONFIG.phone;
    const smsBody = &#x27;[&#x27; + placeName + &#x27;] 길안내 관련 문의드립니다.&#x27;;
    $(&#x27;smsButton&#x27;).href = &#x27;sms:&#x27; + CONFIG.phone + (isIOS ? &#x27;&amp;&#x27; : &#x27;?&#x27;) + &#x27;body=&#x27; + encodeURIComponent(smsBody);
    document.querySelectorAll(&#x27;[data-contact]&#x27;).forEach(function (link) {
      link.addEventListener(&#x27;click&#x27;, function (event) {
        buzz();
        if (!PREVIEW) return;

        showToast(link.dataset.contact === &#x27;call&#x27; ? &#x27;미리보기 · 한명국님에게 전화 연결&#x27; : &#x27;미리보기 · 현장명이 담긴 문자창 열기&#x27;);

    /* ── 상태별 화면 정의 ── */
    const STATES = {
      loading:     { tag: &#x27;확인 중&#x27;,   title: &#x27;목적지를 확인하고 있어요&#x27;, detail: &#x27;잠시만 기다려 주세요.&#x27;, icon: &#x27;clock&#x27;, cta: &#x27;길안내 준비 중&#x27;, sub: &#x27;목적지 위치를 확인하고 있어요&#x27;, action: &#x27;wait&#x27; },

    function renderState(state) {

      --hero-muted: #d1e1d6;
      --hero-line: rgba(255, 255, 255, .14);
      --cta-glow: rgba(254, 229, 0, .14);
      --shine: rgba(255, 255, 255, .6);
      --notice: #283b2d;
      --notice-ink: #c2d7b7;
      --error-bg: #3c2c25;
      --error-ink: #f3b59d;
      --focus: #c7dfa9;
      --disabled: #2c3a2f;
      --disabled-ink: #b8c4b5;
      --toast: #e8efd9;
      --call: #9ad8ae;
      --call-bg: #24392b;
      --sms: #abc4f3;
      --sms-bg: #24304a;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { min-width: 280px; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, &quot;Noto Sans CJK KR&quot;, &quot;Noto Sans KR&quot;, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, a, summary { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; cursor: pointer; }
    button:disabled { cursor: default; }
    button, a { touch-action: manipulation; }
    a { color: inherit; }
    button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
    svg { display: block; flex: none; }
    .icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon.fill { fill: currentColor; stroke: none; }
    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

    /* ── 페이지 ── */
    .page-shell {
      width: 100%;
      max-width: 464px;
      margin: 0 auto;
      padding: calc(20px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));
      animation: arrive 260ms ease-out both;
    }
    .app-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 750; letter-spacing: -.035em; }
    .brand-mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: var(--ink); color: var(--page); }
    .brand-mark .icon { width: 19px; height: 19px; }
    .theme-switch { display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--ink); }
    .theme-switch .icon { width: 18px; height: 18px; }

    .intro { margin: 26px 0 20px; }
    .eyebrow { margin: 0 0 8px; font-size: 11px; font-weight: 650; color: var(--muted); letter-spacing: .06em; }
    .intro-title { margin: 0; font-size: 30px; line-height: 1.28; font-weight: 800; letter-spacing: -.065em; word-break: keep-all; }
    .intro-title span { color: var(--green-text); }
    .intro-description { margin: 8px 0 0; font-size: 13px; line-height: 1.6; color: var(--muted); letter-spacing: -.03em; }

    /* ── 목적지 카드: 현재 위치 → 도착지 경로 ── */
    .destination {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: 22px 22px 18px;
      border-radius: var(--radius);
      background: var(--hero);
      color: var(--hero-ink);
    }
    .route-art { position: absolute; top: 0; right: 0; width: 142px; height: 122px; color: #9cc4a6; opacity: .2; z-index: -1; pointer-events: none; }
    .destination-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .destination-label { display: flex; align-items: center; gap: 7px; margin: 0; color: var(--hero-muted); font-size: 12px; font-weight: 650; }
    .destination-label .icon { width: 16px; height: 16px; }
    .destination-tag { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--hero-line); border-radius: 20px; padding: 4px 10px; font-size: 10.5px; font-weight: 650; color: var(--hero-muted); line-height: 1.4; }
    .destination-tag::before { content: &quot;&quot;; width: 5px; height: 5px; background: var(--yellow); border-radius: 50%; }

    .trip { display: grid; grid-template-columns: 24px minmax(0, 1fr); column-gap: 13px; align-items: center; margin-bottom: 20px; }
    .from-dot { justify-self: center; width: 13px; height: 13px; border-radius: 50%; border: 2.5px solid var(--hero-muted); }
    .from-text { margin: 0; font-size: 13px; font-weight: 600; color: var(--hero-muted); }
    .rail { justify-self: center; width: 3px; height: 38px; margin: 7px 0; border-radius: 3px; background: var(--yellow); transform-origin: top; }
    .trip .pin { justify-self: center; align-self: start; margin-top: 5px; width: 22px; height: 28px; color: var(--yellow); }
    .trip .pin .dot { fill: var(--hero); }
    .destination h1 { margin: 0; font-size: 27px; font-weight: 800; line-height: 1.38; letter-spacing: -.055em; word-break: keep-all; overflow-wrap: anywhere; }

    .address-block { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--hero-line); padding-top: 15px; }
    .address-text { flex: 1; min-width: 0; }
    .address { margin: 0; color: var(--hero-muted); font-size: 13.5px; line-height: 1.7; letter-spacing: -.015em; word-break: keep-all; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
    .coordinates { margin: 3px 0 0; color: var(--hero-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .copy-button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; flex: none; min-width: 48px; min-height: 48px; border: 1px solid var(--hero-line); border-radius: 13px; padding: 6px; background: transparent; color: var(--hero-ink); font-size: 9.5px; line-height: 1.4; }
    .copy-button .icon { width: 16px; height: 16px; }

    /* 경로 움직임: 찾는 중엔 선이 늘었다 줄고, 찾으면 선이 그어진 뒤 핀이 떨어짐 */
    body[data-phase=&quot;loading&quot;] .rail { animation: draw 1.1s ease-in-out infinite alternate; }
    body[data-phase=&quot;loading&quot;] .trip .pin { animation: bob 1.1s ease-in-out infinite; }
    body[data-phase=&quot;ok&quot;] .rail { animation: grow .5s ease-out both; }
    body[data-phase=&quot;ok&quot;] .trip .pin { animation: drop .45s cubic-bezier(.3, 1.5, .5, 1) .35s both; }
    body[data-phase=&quot;fail&quot;] .rail, body[data-phase=&quot;fail&quot;] .trip .pin { opacity: .3; }

    /* ── 상태 안내 + 출발 버튼 ── */
    .navigation { margin-top: 14px; }
    .status-panel { display: flex; align-items: flex-start; gap: 10px; background: var(--notice); color: var(--notice-ink); border-radius: 16px; padding: 14px 15px; margin: 0 0 12px; animation: arrive .22s ease-out both; }
    .status-panel[data-tone=&quot;error&quot;] { background: var(--error-bg); color: var(--error-ink); }
    .status-panel &gt; .icon { width: 18px; height: 18px; margin-top: 2px; }
    .status-copy { min-width: 0; }
    .status-title { margin: 0; font-size: 13.5px; line-height: 1.5; font-weight: 750; letter-spacing: -.035em; }
    .status-description { margin: 3px 0 0; font-size: 12px; line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere; }

    .primary-button {
      position: relative;
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      min-height: 70px;
      border: 0;
      border-radius: 19px;
      padding: 10px 18px 10px 10px;
      background: var(--yellow);
      color: var(--yellow-ink);
      text-align: left;
      transition: transform 130ms ease, box-shadow 200ms ease, opacity 200ms ease;
    }
    .primary-button[data-variant=&quot;primary&quot;]:not(:disabled) { box-shadow: 0 8px 22px var(--cta-glow); }
    .primary-button:disabled { opacity: .78; }
    .cta-ico { position: relative; display: grid; place-items: center; width: 50px; height: 50px; border-radius: 15px; background: var(--yellow-ink); color: var(--yellow); flex: none; }
    .cta-ico .icon { width: 22px; height: 22px; }
    .cta-txt { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .cta-txt strong { font-size: 16.5px; font-weight: 800; line-height: 1.35; letter-spacing: -.045em; overflow-wrap: anywhere; }
    .cta-txt small { font-size: 12px; line-height: 1.4; opacity: .68; letter-spacing: -.02em; }
    .cta-arrow { position: relative; width: 18px; height: 18px; opacity: .6; }
    .primary-button:disabled .cta-arrow { display: none; }
    .spinner { width: 20px; height: 20px; border: 2.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 900ms linear infinite; }
    /* 재시도·문의 같은 보조 동작은 차분한 색 */
    .primary-button[data-variant=&quot;secondary&quot;] { background: var(--soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
    .primary-button[data-variant=&quot;secondary&quot;] .cta-ico { background: var(--surface); color: var(--green-text); }

    /* 출발 준비 완료일 때만: 파동 + 빛 + 아이콘 숨쉬기 + 화살표 밀기 */
    .primary-button::after { content: &quot;&quot;; position: absolute; inset: 0; border-radius: inherit; border: 2px solid var(--yellow); opacity: 0; pointer-events: none; }
    .shine { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
    .shine::before { content: &quot;&quot;; position: absolute; top: 0; bottom: 0; left: -45%; width: 35%; background: linear-gradient(100deg, transparent, var(--shine), transparent); opacity: 0; transform: skewX(-20deg); }
    body[data-state=&quot;ready&quot;] .primary-button::after { animation: ring 2.2s ease-out .5s infinite; }
    body[data-state=&quot;ready&quot;] .shine::before { animation: sweep 3.4s ease-in-out 1s infinite; }
    body[data-state=&quot;ready&quot;] .cta-ico .icon { animation: breathe 2.2s ease-in-out .5s infinite; }
    body[data-state=&quot;ready&quot;] .cta-arrow { animation: nudge 1.4s ease-in-out infinite; }

    .help { margin: 4px 0 0; }
    .help summary { list-style: none; display: flex; align-items: center; justify-content: center; gap: 5px; min-height: 44px; padding: 10px 4px; font-size: 11.5px; color: var(--muted); cursor: pointer; }
    .help summary::-webkit-details-marker { display: none; }
    .help summary .icon { width: 13px; height: 13px; transition: transform 130ms ease; }
    .help[open] summary .icon { transform: rotate(180deg); }
    .help-content { padding: 13px 15px; border: 1px solid var(--line); border-radius: 14px; color: var(--muted); font-size: 12px; line-height: 1.8; }
    .help-content p { margin: 0; }
    .help-content p + p { margin-top: 6px; }

    /* ── 하단 서명 (시스템 담당) ── */
    .sig { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); scroll-margin: 24px; }
    .sig-k { display: block; margin-bottom: 3px; font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .sig-n { display: inline-flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 800; letter-spacing: .02em; }
    .sig-n::before { content: &quot;&quot;; width: 7px; height: 7px; border-radius: 2px; background: var(--yellow); transform: rotate(45deg); }
    .sig-act { display: flex; gap: 8px; }
    .ic { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); text-decoration: none; transition: transform 130ms ease, background 200ms, color 200ms, border-color 200ms; }
    .ic .icon { width: 18px; height: 18px; }
    .sig.attn .sig-k { color: var(--error-ink); }
    .sig.attn .ic.call { background: var(--call-bg); border-color: transparent; color: var(--call); }
    .sig.attn .ic.sms { background: var(--sms-bg); border-color: transparent; color: var(--sms); }
    .sig.flash .ic { animation: pop .45s ease-out 2; }

    .footer { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 20px 0 0; color: var(--muted); font-size: 10.5px; letter-spacing: -.015em; }
    .footer .icon { width: 13px; height: 13px; }

    .toast { position: fixed; z-index: 5; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); width: max-content; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 8px; padding: 12px 17px; border-radius: 15px; background: var(--toast); color: var(--page); font-size: 12.5px; line-height: 1.6; pointer-events: none; opacity: 0; transform: translate(-50%, 10px); transition: opacity 160ms ease, transform 160ms ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast .icon { width: 16px; height: 16px; }
    .no-script { border-radius: 16px; background: var(--error-bg); color: var(--error-ink); padding: 15px; margin: 0 0 16px; font-size: 13px; }
    .no-script p { margin: 0; }

    .theme-switch, .copy-button { transition: transform 130ms ease, opacity 130ms ease; }
    .theme-switch:active, .copy-button:active, .ic:active { transform: scale(.92); }
    .primary-button:active:not(:disabled) { transform: scale(.975); }
    @media (hover: hover) {
      .theme-switch:hover, .copy-button:hover, .primary-button:hover:not(:disabled), .ic:hover { opacity: .88; }
    }
    @media (min-width: 600px) { .page-shell { padding-top: 36px; padding-bottom: 32px; } .intro { margin-top: 32px; } }
    @media (max-width: 359px) {
      .page-shell { padding-left: 16px; padding-right: 16px; }
      .intro-title { font-size: 27px; }
      .destination { padding: 20px 18px 16px; }
      .destination h1 { font-size: 24px; }
      .cta-txt strong { font-size: 15px; }
    }

    @keyframes arrive { from { opacity: 0; transform: translateY(6px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes draw { from { transform: scaleY(.15); } to { transform: scaleY(1); } }
    @keyframes grow { from { transform: scaleY(0); } }
    @keyframes bob { 50% { transform: translateY(-5px); } }
    @keyframes drop { from { transform: translateY(-14px); opacity: 0; } }
    @keyframes ring { 0% { opacity: .8; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(1.05, 1.3); } }
    @keyframes sweep {
      0% { transform: translateX(0) skewX(-20deg); opacity: 1; }
      35% { transform: translateX(470%) skewX(-20deg); opacity: 1; }
      36%, 100% { transform: translateX(470%) skewX(-20deg); opacity: 0; }
    }
    @keyframes breathe { 50% { transform: scale(1.14) rotate(-8deg); } }
    @keyframes nudge { 50% { transform: translateX(4px); } }
    @keyframes pop { 50% { transform: scale(1.15); } }

    /* 폰에서 &#x27;동작 줄이기&#x27;를 켠 경우 모든 움직임 끔 */
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

    .reduced-effects .shine::before,
    .reduced-effects .primary-button::after,
    .reduced-effects .cta-ico .icon,
    .reduced-effects .cta-arrow { animation: none !important; }

    &lt;div class=&quot;intro&quot;&gt;
      &lt;p class=&quot;eyebrow&quot;&gt;오늘도, 안전한 이동&lt;/p&gt;

      launcherror: { tag: &#x27;방문 장소&#x27;, title: &#x27;카카오내비를 열지 못했어요&#x27;, detail: &#x27;앱 설치 여부를 확인한 뒤 다시 눌러 주세요.&#x27;, icon: &#x27;alert&#x27;, tone: &#x27;error&#x27;, cta: &#x27;카카오내비 다시 열기&#x27;, sub: &#x27;앱 설치 후 다시 눌러 주세요&#x27;, action: &#x27;navigate&#x27;, buttonIcon: &#x27;go&#x27; }
    };

    function renderState(state) {
      const model = STATES[state] || STATES.sdkerror;
      currentState = STATES[state] ? state : &#x27;sdkerror&#x27;;
      const fail = model.tone === &#x27;error&#x27; &amp;&amp; currentState !== &#x27;launcherror&#x27;;

      $(&#x27;destinationTag&#x27;).textContent = model.tag;

      $(&#x27;statusPanel&#x27;).hidden = !model.title;
      $(&#x27;statusPanel&#x27;).dataset.tone = model.tone || &#x27;info&#x27;;
      $(&#x27;statusTitle&#x27;).textContent = model.title || &#x27;&#x27;;
      $(&#x27;statusDescription&#x27;).textContent = model.detail || &#x27;&#x27;;

      $(&#x27;primaryText&#x27;).textContent = model.cta;
      $(&#x27;primarySub&#x27;).textContent = model.sub || &#x27;&#x27;;
      btn.disabled = model.action === &#x27;wait&#x27;;
      btn.dataset.variant = (model.action === &#x27;navigate&#x27; || model.action === &#x27;wait&#x27;) ? &#x27;primary&#x27; : &#x27;secondary&#x27;;
      $(&#x27;primarySpinner&#x27;).hidden = currentState !== &#x27;loading&#x27;;
      $(&#x27;primaryIconWrap&#x27;).toggleAttribute(&#x27;hidden&#x27;, currentState === &#x27;loading&#x27;);
      setIcon(&#x27;primaryIcon&#x27;, model.buttonIcon || &#x27;refresh&#x27;);
      $(&#x27;primaryIconWrap&#x27;).classList.toggle(&#x27;fill&#x27;, (model.buttonIcon || &#x27;&#x27;) === &#x27;go&#x27;);

      const attn = model.tone === &#x27;error&#x27; || model.action === &#x27;contact&#x27;;
      $(&#x27;contact&#x27;).classList.toggle(&#x27;attn&#x27;, attn);
      $(&#x27;sigK&#x27;).textContent = attn ? &#x27;문의 · System by&#x27; : &#x27;System by&#x27;;

      $(&#x27;help&#x27;).hidden = [&#x27;ready&#x27;, &#x27;opening&#x27;, &#x27;launcherror&#x27;, &#x27;desktop&#x27;].indexOf(currentState) === -1;
      if (currentState === &#x27;missing&#x27;) {
        $(&#x27;destinationTitle&#x27;).textContent = &#x27;목적지 정보가 없어요&#x27;;
        $(&#x27;address&#x27;).textContent = &#x27;받으신 링크에 목적지가 포함되어 있지 않아요.&#x27;;
      }
      if (currentState === &#x27;invalid&#x27; &amp;&amp; !address) $(&#x27;address&#x27;).textContent = &#x27;전달받은 위치를 확인할 수 없어요.&#x27;;

    function validCoordinates(x, y) {
      return Number.isFinite(x) &amp;&amp; Number.isFinite(y) &amp;&amp; x &gt;= -180 &amp;&amp; x &lt;= 180 &amp;&amp; y &gt;= -90 &amp;&amp; y &lt;= 90;

    function displayCoordinates() {
      if (!address &amp;&amp; coordinates) {
        $(&#x27;coordinates&#x27;).textContent = &#x27;위도 &#x27; + coordinates.y.toFixed(5) + &#x27; · 경도 &#x27; + coordinates.x.toFixed(5);
        $(&#x27;coordinates&#x27;).hidden = false;

    function startNavi() {

      launchCooldown = true;
      setTimeout(function () { launchCooldown = false; }, 900);
      if (PREVIEW) { renderState(&#x27;opening&#x27;); return; }
      if (!isMobile) { renderState(&#x27;desktop&#x27;); return; }
      try {
        if (!window.Kakao || !Kakao.Navi || !Kakao.isInitialized()) throw new Error(&#x27;Kakao Navi is not initialized&#x27;);

        console.warn(&#x27;[현장 길안내] 앱 연결 실패&#x27;, error);

    $(&#x27;primaryButton&#x27;).addEventListener(&#x27;click&#x27;, function () {
      const action = STATES[currentState].action;
      buzz();
      if (action === &#x27;navigate&#x27;) startNavi();
      if (action === &#x27;retry&#x27;) {
        if (PREVIEW) {
          renderState(&#x27;loading&#x27;);
          clearTimeout(previewTimer);
          previewTimer = setTimeout(function () { renderState(&#x27;ready&#x27;); }, 900);
        } else resolveDestination();

      if (action === &#x27;contact&#x27;) {
        const sig = $(&#x27;contact&#x27;);
        sig.scrollIntoView({ behavior: &#x27;auto&#x27;, block: &#x27;center&#x27; });
        sig.classList.remove(&#x27;flash&#x27;); void sig.offsetWidth; sig.classList.add(&#x27;flash&#x27;);
        $(&#x27;callButton&#x27;).focus({ preventScroll: true });

      if (action === &#x27;copylink&#x27;) {
        copyText(location.href).then(function (ok) { showToast(ok ? &#x27;안내 링크를 복사했어요&#x27; : &#x27;주소창의 링크를 복사해 주세요.&#x27;, false, ok ? &#x27;check&#x27; : &#x27;alert&#x27;); });

    /* ── 카카오 SDK는 화면을 먼저 보여준 뒤 비동기로 불러옵니다 ── */
    function loadScript(id, src) {
      if (scriptPromises[id]) return scriptPromises[id];
      scriptPromises[id] = new Promise(function (resolve, reject) {
        const previous = document.getElementById(id);
        if (previous) previous.remove();
        const script = document.createElement(&#x27;script&#x27;);
        script.id = id;

    function loadNaviSDK() {

      return loaded.then(function () {

    function resolveDestination() {
      const token = ++requestId;
      clearTimeout(requestTimer);
      coordinates = null;
      if (rawLat &amp;&amp; rawLng) {
        const x = Number(rawLng), y = Number(rawLat);
        if (!validCoordinates(x, y)) { renderState(&#x27;invalid&#x27;); return; }
        coordinates = { x: x, y: y };
      } else if (!address) {
        renderState(rawLat || rawLng ? &#x27;invalid&#x27; : &#x27;missing&#x27;);
        return;
      }
      if (navigator.onLine === false) { renderState(&#x27;offline&#x27;); return; }

      requestTimer = setTimeout(function () {

        clearTimeout(requestTimer);

        displayCoordinates();
        renderState(isMobile ? &#x27;ready&#x27; : &#x27;desktop&#x27;);
        /* 휴대폰에서 처음 준비되면 카카오내비를 1회 자동 실행 */
        if (isMobile &amp;&amp; CONFIG.autoOpen &amp;&amp; !autoOpened) { autoOpened = true; startNavi(); }

        if (token !== requestId) return;

        } catch (error) { fail(&#x27;sdkerror&#x27;, error); }

        loadNaviSDK().then(function () { ready(supplied.x, supplied.y); }).catch(function (error) { fail(&#x27;sdkerror&#x27;, error); });

    }
