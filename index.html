<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)" />
    <title>카카오내비 길안내</title>
    <!-- 카카오 JavaScript SDK (카카오내비 실행용) -->
    <script
      src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.4/kakao.min.js"
      crossorigin="anonymous"
    ></script>
    <style>
      /* 저사양 폰 배려: 웹폰트·블러·큰 그림자 없음, 애니메이션은 transform/opacity만 사용 */
      :root {
        --bg: #f4f5f7;
        --card: #ffffff;
        --ink: #191919;
        --sub: #6b7280;
        --faint: #9ca3af;
        --line: #eceef1;
        --soft: #f5f6f8;
        --accent: #fee500;
        --accent-ink: #191919;
        --ok: #16a34a;
        --err: #d93025;
        --call: #15803d;
        --call-bg: #e9f7ee;
        --sms: #2563eb;
        --sms-bg: #eaf1fe;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 6px 20px rgba(0, 0, 0, 0.05);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f0f10;
          --card: #1a1a1c;
          --ink: #f2f2f3;
          --sub: #a1a1aa;
          --faint: #71717a;
          --line: #2a2a2e;
          --soft: #232326;
          --ok: #4ade80;
          --err: #f28b82;
          --call: #4ade80;
          --call-bg: #16291d;
          --sms: #7aa7ff;
          --sms-bg: #172238;
          --shadow: none;
        }
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Malgun Gothic", "Noto Sans KR", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 460px;
        margin: 0 auto;
        padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
      }
      svg {
        display: block;
        flex: none;
      }

      /* 상단 라벨 */
      .top {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        color: var(--sub);
        letter-spacing: -0.01em;
        margin: 4px 4px 14px;
      }
      .top i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 3px rgba(254, 229, 0, 0.25);
      }

      /* 카드 공통 */
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 22px 20px;
        box-shadow: var(--shadow);
        margin-bottom: 12px;
      }
      .fade {
        animation: up 0.35s ease-out both;
      }
      .fade.d2 {
        animation-delay: 0.08s;
      }
      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }

      /* 목적지 카드 */
      .pin {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: var(--accent);
        color: var(--accent-ink);
        display: grid;
        place-items: center;
        margin-bottom: 16px;
      }
      .label {
        margin: 0 0 4px;
        font-size: 12px;
        font-weight: 600;
        color: var(--faint);
        letter-spacing: 0.04em;
      }
      h1 {
        font-size: 22px;
        font-weight: 800;
        margin: 0 0 10px;
        line-height: 1.35;
        letter-spacing: -0.02em;
        word-break: keep-all;
      }
      .addr-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 22px;
      }
      #addr {
        flex: 1;
        margin: 0;
        color: var(--sub);
        font-size: 15px;
        line-height: 1.55;
        word-break: keep-all;
      }
      .chip {
        flex: none;
        border: 1px solid var(--line);
        background: var(--soft);
        color: var(--sub);
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        padding: 6px 10px;
        border-radius: 999px;
        cursor: pointer;
        transition: transform 0.12s;
      }
      .chip:active {
        transform: scale(0.94);
      }
      .chip[hidden] {
        display: none;
      }

      /* 메인 버튼 */
      .cta {
        position: relative;
        width: 100%;
        min-height: 60px;
        border: 0;
        border-radius: 16px;
        padding: 0 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font: inherit;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.01em;
        background: var(--accent);
        color: var(--accent-ink);
        cursor: pointer;
        transition:
          transform 0.12s ease,
          opacity 0.2s;
      }
      .cta:active:not(:disabled) {
        transform: scale(0.97);
      }
      .cta:disabled {
        cursor: default;
      }
      .cta[data-state="loading"] {
        opacity: 0.7;
      }
      .cta[data-state="fail"] {
        background: var(--soft);
        color: var(--faint);
      }
      .cta .spin {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2.5px solid rgba(25, 25, 25, 0.2);
        border-top-color: #191919;
        animation: spin 0.8s linear infinite;
        display: none;
      }
      .cta[data-state="loading"] .spin {
        display: block;
      }
      .cta .arrow {
        display: none;
        transition: transform 0.2s;
      }
      .cta[data-state="ready"] .arrow {
        display: block;
      }
      /* 준비 완료 시 잔잔한 파동 3회 (가벼운 transform/opacity 애니메이션) */
      .cta::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        border: 2px solid var(--accent);
        opacity: 0;
        pointer-events: none;
      }
      .cta.pulse::after {
        animation: ring 1.6s ease-out 3;
      }
      @keyframes ring {
        0% {
          opacity: 0.9;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(1.08, 1.35);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* 상태 메시지 */
      .msg {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin: 14px 2px 0;
        min-height: 20px;
        font-size: 13.5px;
        line-height: 1.5;
        color: var(--sub);
      }
      .msg .dot {
        flex: none;
        width: 7px;
        height: 7px;
        margin-top: 7px;
        border-radius: 50%;
        background: var(--faint);
      }
      .msg[data-type="load"] .dot {
        animation: blink 1s ease-in-out infinite;
      }
      .msg[data-type="ok"] .dot {
        background: var(--ok);
      }
      .msg[data-type="err"] {
        color: var(--err);
      }
      .msg[data-type="err"] .dot {
        background: var(--err);
      }
      @keyframes blink {
        50% {
          opacity: 0.2;
        }
      }

      .alt {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        margin-top: 16px;
        padding: 12px;
        border-radius: 12px;
        color: var(--sub);
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.15s;
      }
      .alt:active {
        background: var(--soft);
      }

      /* 담당자 카드 */
      .who {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 18px;
      }
      .avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--soft);
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        font-size: 18px;
        font-weight: 800;
      }
      .role {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        color: var(--faint);
      }
      .name {
        margin: 2px 0 0;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .num {
        margin-left: auto;
        font-size: 14px;
        font-weight: 600;
        color: var(--sub);
        text-decoration: none;
        font-variant-numeric: tabular-nums;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .act {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 52px;
        border-radius: 14px;
        font-size: 15.5px;
        font-weight: 700;
        text-decoration: none;
        transition: transform 0.12s ease;
      }
      .act:active {
        transform: scale(0.96);
      }
      .act.call {
        background: var(--call-bg);
        color: var(--call);
      }
      .act.sms {
        background: var(--sms-bg);
        color: var(--sms);
      }

      .foot {
        text-align: center;
        font-size: 12px;
        color: var(--faint);
        margin: 18px 0 0;
      }

      /* 토스트 */
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(24px + env(safe-area-inset-bottom));
        transform: translate(-50%, 20px);
        opacity: 0;
        background: #191919;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        padding: 11px 18px;
        border-radius: 999px;
        pointer-events: none;
        transition:
          opacity 0.2s,
          transform 0.2s;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* 동작 줄이기 설정한 사용자는 애니메이션 끔 */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="top"><i></i>현장 길안내</div>

      <section class="card fade">
        <div class="pin" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" />
            <circle cx="12" cy="9.5" r="2.5" />
          </svg>
        </div>
        <p class="label">목적지</p>
        <h1 id="title">목적지 확인 중…</h1>
        <div class="addr-row">
          <p id="addr"></p>
          <button id="copy" class="chip" hidden>주소 복사</button>
        </div>

        <button id="go" class="cta" data-state="loading" disabled>
          <span class="spin" aria-hidden="true"></span>
          <span id="goText">목적지 찾는 중…</span>
          <svg class="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </button>

        <p id="msg" class="msg" data-type="load" aria-live="polite">
          <span class="dot"></span><span id="msgText">위치 정보를 불러오는 중입니다.</span>
        </p>

        <a id="kakaomap" class="alt" href="#">
          카카오맵으로 열기
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
        </a>
      </section>

      <section class="card fade d2">
        <div class="who">
          <div class="avatar" aria-hidden="true">한</div>
          <div>
            <p class="role">시스템 담당자</p>
            <p class="name">한명국</p>
          </div>
          <a class="num" href="tel:01046912521">010-4691-2521</a>
        </div>
        <div class="actions">
          <a class="act call" href="tel:01046912521" data-haptic>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z" />
            </svg>
            전화하기
          </a>
          <a id="sms" class="act sms" href="sms:01046912521" data-haptic>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z" />
            </svg>
            문자 보내기
          </a>
        </div>
      </section>

      <p class="foot">길안내가 안 되면 담당자에게 바로 연락하세요</p>
    </main>

    <div id="toast" class="toast" role="status"></div>

    <script>
      // ▼▼▼ 여기만 바꾸세요: 카카오디벨로퍼스 [앱] > [플랫폼 키] > [JavaScript 키] 값 ▼▼▼
      const JS_KEY = "3481cdf4ec96ad372e2440d8e832bcf0";
      // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲
      const PHONE = "01046912521"; // 시스템 담당자 한명국

      // 사용 예: https://아이디.github.io/navi/?name=현장명&addr=서울특별시 강남구 테헤란로27길 40
      // 좌표를 알고 있으면 ?name=현장명&lat=37.5&lng=127.0 처럼 보내도 됩니다 (주소 변환 생략).
      const q = new URLSearchParams(location.search);
      const addr = (q.get("addr") || "").trim();
      const name = (q.get("name") || "").trim() || addr || "목적지";
      const lat = q.get("lat"),
        lng = q.get("lng");

      const $ = (id) => document.getElementById(id);
      const go = $("go");
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

      const buzz = () => {
        try {
          if (navigator.vibrate) navigator.vibrate(12);
        } catch (e) {}
      };
      const say = (text, type) => {
        $("msgText").textContent = text;
        $("msg").dataset.type = type || "";
      };
      const setGo = (state, text) => {
        go.dataset.state = state;
        go.disabled = state !== "ready";
        $("goText").textContent = text;
      };
      const fail = (text) => {
        say(text, "err");
        setGo("fail", "안내를 시작할 수 없어요");
      };
      let toastTimer;
      const toast = (text) => {
        const t = $("toast");
        t.textContent = text;
        t.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
      };

      $("title").textContent = name;
      $("addr").textContent = addr;
      $("kakaomap").href =
        "https://map.kakao.com/link/search/" + encodeURIComponent(addr || name);

      // 문자 보내기: 현장명이 미리 적힌 문자창 열기 (iOS / 안드로이드 형식 구분)
      const smsBody = encodeURIComponent("[" + name + "] 길안내 관련 문의드립니다.");
      $("sms").href = "sms:" + PHONE + (isIOS ? "&" : "?") + "body=" + smsBody;

      document.querySelectorAll("[data-haptic]").forEach((el) =>
        el.addEventListener("click", buzz),
      );

      // 주소 복사
      if (addr) {
        $("copy").hidden = false;
        $("copy").onclick = () => {
          buzz();
          const done = () => toast("주소를 복사했어요");
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(addr).then(done, legacyCopy);
          } else legacyCopy();
          function legacyCopy() {
            const ta = document.createElement("textarea");
            ta.value = addr;
            ta.setAttribute("readonly", "");
            ta.style.cssText = "position:fixed;opacity:0";
            document.body.appendChild(ta);
            ta.select();
            try {
              document.execCommand("copy");
              done();
            } catch (e) {
              toast("복사하지 못했어요");
            }
            ta.remove();
          }
        };
      }

      function startNavi(x, y) {
        try {
          Kakao.Navi.start({
            name: name,
            x: Number(x),
            y: Number(y),
            coordType: "wgs84",
          });
          say("카카오내비를 여는 중입니다. 열리지 않으면 위 버튼을 눌러주세요.", "ok");
        } catch (e) {
          say("카카오내비 실행 실패: " + e.message, "err");
        }
      }

      function ready(x, y) {
        setGo("ready", "카카오내비로 안내 시작");
        go.classList.add("pulse");
        go.onclick = () => {
          buzz();
          startNavi(x, y);
        };
        if (!isMobile) {
          say(
            "목적지를 찾았습니다. (설정 정상 · 좌표 " +
              Number(y).toFixed(5) +
              ", " +
              Number(x).toFixed(5) +
              ") 카카오내비 실행은 휴대폰에서만 됩니다.",
            "ok",
          );
          return;
        }
        say("목적지를 찾았습니다.", "ok");
        startNavi(x, y); // 자동 실행 1회 (휴대폰에 따라 버튼을 한 번 더 눌러야 할 수 있음)
      }

      if (typeof Kakao === "undefined") {
        fail("카카오 SDK를 불러오지 못했습니다. 인터넷 연결을 확인하세요.");
      } else {
        try {
          if (!Kakao.isInitialized()) Kakao.init(JS_KEY);
        } catch (e) {
          say("JavaScript 키 설정을 확인하세요: " + e.message, "err");
        }

        if (lat && lng) {
          ready(lng, lat);
        } else if (!addr) {
          fail("주소가 전달되지 않았습니다. 링크에 addr= 값이 있는지 확인하세요.");
        } else {
          // 카카오맵 SDK로 주소 → 좌표 변환 (JavaScript 키 사용, REST 키 노출 없음)
          const s = document.createElement("script");
          s.src =
            "https://dapi.kakao.com/v2/maps/sdk.js?appkey=" +
            JS_KEY +
            "&libraries=services&autoload=false";
          s.onerror = () =>
            fail(
              "카카오맵 SDK를 불러오지 못했습니다. [카카오맵 사용 설정]과 [JavaScript SDK 도메인] 등록을 확인하세요.",
            );
          s.onload = () =>
            kakao.maps.load(() => {
              const OK = kakao.maps.services.Status.OK;
              new kakao.maps.services.Geocoder().addressSearch(
                addr,
                (res, status) => {
                  if (status === OK && res.length)
                    return ready(res[0].x, res[0].y);
                  // 주소로 못 찾으면 키워드(장소명) 검색으로 한 번 더 시도
                  new kakao.maps.services.Places().keywordSearch(
                    addr,
                    (res2, status2) => {
                      if (status2 === OK && res2.length)
                        return ready(res2[0].x, res2[0].y);
                      fail(
                        "주소를 찾지 못했습니다. 주소 표기를 확인하거나 아래 카카오맵으로 열기를 이용하세요.",
                      );
                    },
                  );
                },
              );
            });
          document.head.appendChild(s);
        }
      }
    </script>
  </body>
</html>
