<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5ef" id="themeColor">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="현장 목적지를 확인하고 카카오내비로 간편하게 출발하세요.">
  <title>현장 길안내</title>
  <script>
    /* 테마는 첫 화면을 그리기 전에 적용합니다. */
    (function () {
      var theme;
      try { theme = localStorage.getItem('field-navi-theme'); } catch (e) {}
      if (window.__NAVI_PREVIEW__) theme = window.__NAVI_PREVIEW__.theme;
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    /* 시스템 글꼴 + 인라인 SVG. 웹폰트, 이미지, 지도 렌더링, 블러 없음. */
    :root {
      color-scheme: light;
      --page: #f5f5ef;
      --surface: #ffffff;
      --ink: #193a32;
      --muted: #64736c;
      --line: #dfe5dc;
      --soft: #edf1e9;
      --green: #214e41;
      --green-text: #28624f;
      --hero: #204c40;
      --hero-ink: #ffffff;
      --hero-muted: #d1e1d6;
      --hero-line: #527266;
      --yellow: #fee500;
      --yellow-ink: #282a17;
      --notice: #edf2e9;
      --notice-ink: #365c48;
      --error-bg: #fbefea;
      --error-ink: #95482e;
      --focus: #397f65;
      --disabled: #e5e9e0;
      --disabled-ink: #5c6c60;
      --toast: #19392f;
      --radius: 26px;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #141d19;
      --surface: #1e2a23;
      --ink: #edf1e8;
      --muted: #acb9ad;
      --line: #35453a;
      --soft: #2b3b2f;
      --green: #b7d6b7;
      --green-text: #c0dabb;
      --hero: #264e40;
      --hero-ink: #f7faf2;
      --hero-muted: #d1e1d6;
      --hero-line: #5a7768;
      --notice: #283b2d;
      --notice-ink: #c2d7b7;
      --error-bg: #3c2c25;
      --error-ink: #f3b59d;
      --focus: #c7dfa9;
      --disabled: #2c3a2f;
      --disabled-ink: #b8c4b5;
      --toast: #e8efd9;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { min-width: 280px; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans CJK KR", "Noto Sans KR", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, a, summary { -webkit-tap-highlight-color: transparent; }
    button, input { font: inherit; }
    button, a { touch-action: manipulation; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    a { color: inherit; }
    button:focus-visible, a:focus-visible, summary:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 4px;
    }
    svg { display: block; flex: none; }
    .icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .page-shell {
      width: 100%;
      max-width: 464px;
      margin: 0 auto;
      padding: calc(22px + env(safe-area-inset-top)) 24px calc(22px + env(safe-area-inset-bottom));
      animation: arrive 240ms ease-out both;
    }
    .app-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 750; letter-spacing: -.035em; }
    .brand-mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: var(--ink); color: var(--page); }
    .brand-mark .icon { width: 20px; height: 20px; }
    .theme-switch { display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--ink); }
    .theme-switch .icon { width: 18px; height: 18px; }
    .brand-logo { display: block; height: 28px; width: auto; max-width: 180px; }
    .intro { margin: 22px 0 16px; }
    .intro-title { margin: 0; font-size: 28px; line-height: 1.3; font-weight: 800; letter-spacing: -.06em; word-break: keep-all; }
    .intro-title span { color: var(--green-text); }
    .destination {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: 24px 22px 20px;
      border-radius: var(--radius);
      background: var(--hero);
      color: var(--hero-ink);
    }
    /* 경로 그림: 찾는 중엔 점선이 흐르고, 찾으면 노란 길이 그려지며 도착점이 톡 켜짐 */
    .route-art { position: absolute; top: 4px; right: 0; width: 124px; height: 106px; z-index: -1; pointer-events: none; }
    .route-art .ra-bg { stroke: #98bda0; stroke-width: 1.5; opacity: .2; }
    .route-art .ra-wait { stroke: #98bda0; stroke-width: 1.5; opacity: .5; stroke-dasharray: 1.5 3; stroke-linecap: round; }
    .route-art .ra-live { stroke: var(--yellow); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; }
    .route-art .ra-ring { stroke: #98bda0; stroke-width: 1.5; opacity: .5; transform-box: fill-box; transform-origin: center; }
    .route-art .ra-dot { fill: #98bda0; opacity: .6; transform-box: fill-box; transform-origin: center; }
    body[data-state="loading"] .ra-wait { animation: march 1s linear infinite; }
    body[data-state="loading"] .ra-ring { animation: ping 1.4s ease-out infinite; }
    body[data-found="1"] .ra-live { stroke-dashoffset: 0; transition: stroke-dashoffset 700ms cubic-bezier(.3,.7,.2,1); }
    body[data-found="1"] .ra-wait { opacity: 0; }
    body[data-found="1"] .ra-ring { stroke: var(--yellow); opacity: .9; }
    body[data-found="1"] .ra-dot { fill: var(--yellow); opacity: 1; animation: pop 420ms 560ms cubic-bezier(.3,1.6,.5,1) both; }
    @keyframes march { to { stroke-dashoffset: -9; } }
    @keyframes ping { 0% { transform: scale(.7); opacity: .7; } 100% { transform: scale(1.5); opacity: 0; } }
    @keyframes pop { 0% { transform: scale(.3); } 100% { transform: scale(1); } }
    .destination-top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; margin-bottom: 20px; padding-right: 84px; }
    .destination-label { display: flex; align-items: center; gap: 7px; margin: 0; color: var(--hero-muted); font-size: 12px; font-weight: 650; }
    .destination-label .icon { width: 16px; height: 16px; }
    .destination-tag { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--hero-line); border-radius: 20px; padding: 4px 9px; font-size: 10px; font-weight: 600; color: var(--hero-muted); line-height: 1.4; }
    .destination-tag::before { content: ""; display: block; width: 4px; height: 4px; background: #d3e7b6; border-radius: 50%; }
    .destination h1 { position: relative; max-width: 100%; margin: 0 0 22px; padding-right: 76px; font-size: 27px; font-weight: 750; line-height: 1.38; letter-spacing: -.055em; word-break: keep-all; overflow-wrap: anywhere; }
    .address-block { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--hero-line); padding-top: 16px; }
    .address-text { flex: 1; min-width: 0; }
    .address { margin: 0; color: var(--hero-muted); font-size: 13px; line-height: 1.75; letter-spacing: -.015em; word-break: keep-all; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
    .coordinates { margin: 4px 0 0; color: var(--hero-muted); font-size: 11px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .copy-button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; flex: none; min-width: 44px; min-height: 48px; border: 1px solid var(--hero-line); border-radius: 12px; padding: 6px; background: transparent; color: var(--hero-ink); font-size: 9px; line-height: 1.4; }
    .copy-button .icon { width: 16px; height: 16px; }
    .copy-button:focus-visible { outline-color: #e2efbb; }
    .navigation { margin-top: 14px; }
    .status-panel { display: flex; align-items: flex-start; gap: 10px; background: var(--notice); color: var(--notice-ink); border-radius: 16px; padding: 14px 15px; margin: 0 0 12px; }
    .status-panel[data-tone="error"] { background: var(--error-bg); color: var(--error-ink); }
    .status-panel > .icon { width: 18px; height: 18px; margin-top: 2px; }
    .status-copy { min-width: 0; }
    .status-title { margin: 0; font-size: 13px; line-height: 1.5; font-weight: 750; letter-spacing: -.035em; }
    .status-description { margin: 4px 0 0; font-size: 12px; line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere; }
    .primary-button { position: relative; overflow: hidden; isolation: isolate; display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; min-height: 60px; border: 0; border-radius: 17px; padding: 16px; background: var(--yellow); color: var(--yellow-ink); font-size: 16px; font-weight: 750; line-height: 1.45; letter-spacing: -.04em; transition: transform 130ms ease, opacity 130ms ease; }
    .primary-button .icon { width: 20px; height: 20px; }
    .primary-button .cta-arrow { margin-left: auto; width: 18px; height: 18px; }
    .primary-button #primaryText { flex: 1; text-align: left; overflow-wrap: anywhere; }
    .primary-button[data-variant="secondary"] { background: var(--soft); color: var(--ink); border: 1px solid var(--line); }
    .primary-button:disabled { background: var(--disabled); color: var(--disabled-ink); }
    .primary-button:disabled .cta-arrow { display: none; }
    .primary-button::before { /* 카카오내비 연결 중: 빛이 버튼을 훑고 지나감 */
      content: ""; position: absolute; inset: 0; z-index: -1; transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent);
    }
    body[data-state="opening"] .primary-button::before { animation: sweep 1.1s ease-in-out 2; }
    body[data-state="opening"] .primary-button .cta-arrow { transform: translateX(3px); }
    .primary-button .cta-arrow { transition: transform 200ms ease; }
    @keyframes sweep { to { transform: translateX(100%); } }
    .spinner { width: 18px; height: 18px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; flex: none; animation: spin 900ms linear infinite; }
    .help { margin: 4px 0 0; }
    .help summary { list-style: none; display: flex; align-items: center; justify-content: center; gap: 5px; min-height: 44px; padding: 10px 4px; font-size: 11px; color: var(--muted); cursor: pointer; }
    .help summary::-webkit-details-marker { display: none; }
    .help summary .icon { width: 13px; height: 13px; transition: transform 130ms ease; }
    .help[open] summary .icon { transform: rotate(180deg); }
    .help-content { padding: 13px 15px; border: 1px solid var(--line); border-radius: 14px; color: var(--muted); font-size: 12px; line-height: 1.8; }
    .help-content p { margin: 0; }
    .help-content p + p { margin-top: 6px; }
    .contact { margin-top: 24px; scroll-margin-top: 18px; }
    .section-heading { display: flex; align-items: center; gap: 10px; margin: 0 0 11px; font-size: 13px; font-weight: 650; letter-spacing: -.025em; }
    .section-heading::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .contact-card { border: 1px solid var(--line); border-radius: 22px; background: var(--surface); padding: 18px; }
    .contact-identity { display: grid; grid-template-columns: 42px minmax(0,1fr) auto; align-items: center; gap: 11px; }
    .avatar { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; background: var(--soft); color: var(--green-text); font-size: 17px; font-weight: 700; }
    .contact-role { margin: 0 0 1px; color: var(--muted); font-size: 10px; }
    .contact-name { margin: 0; font-size: 17px; font-weight: 750; letter-spacing: -.045em; }
    .phone-number { display: flex; align-items: center; min-height: 44px; font-size: 12px; font-weight: 600; text-decoration: none; white-space: nowrap; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
    .contact-actions { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; margin-top: 16px; }
    .contact-action { display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 49px; padding: 12px 8px; border-radius: 13px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; font-size: 13px; font-weight: 650; letter-spacing: -.025em; line-height: 1.5; transition: transform 130ms ease, opacity 130ms ease; }
    .contact-action .icon { width: 17px; height: 17px; }
    .contact-action.call { border-color: transparent; background: var(--soft); color: var(--green-text); }
    .contact-card { transition: border-color 200ms ease; }
    body[data-tone="error"] .contact-card { border-color: var(--error-ink); }  /* 문제가 생기면 연락처를 눈에 띄게 */
    .footer { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 24px 0 0; color: var(--muted); font-size: 10px; letter-spacing: -.015em; }
    .footer .icon { width: 13px; height: 13px; }
    .toast { position: fixed; z-index: 5; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); width: max-content; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 8px; padding: 12px 17px; border-radius: 15px; background: var(--toast); color: var(--page); font-size: 12px; line-height: 1.6; pointer-events: none; opacity: 0; transform: translate(-50%, 10px); transition: opacity 160ms ease, transform 160ms ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast .icon { width: 16px; height: 16px; }
    .no-script { border-radius: 16px; background: var(--error-bg); color: var(--error-ink); padding: 15px; margin: 0 0 16px; font-size: 13px; }
    .no-script p { margin: 0; }
    .theme-switch, .copy-button { transition: transform 130ms ease, opacity 130ms ease; }
    .theme-switch:active, .copy-button:active, .primary-button:active:not(:disabled), .contact-action:active { transform: scale(.975); }
    @media (hover: hover) {
      .theme-switch:hover, .copy-button:hover, .primary-button:hover:not(:disabled), .contact-action:hover { opacity: .88; }
    }
    @media (min-width: 600px) { .page-shell { padding-top: 38px; padding-bottom: 34px; } .intro { margin-top: 35px; } }
    @media (max-width: 359px) {
      .page-shell { padding-left: 18px; padding-right: 18px; }
      .intro-title { font-size: 28px; }
      .destination { padding: 21px 19px 18px; }
      .destination h1 { font-size: 24px; }
      .contact-card { padding: 16px; }
      .contact-identity { grid-template-columns: 40px minmax(0,1fr); gap: 0 10px; }
      .avatar { grid-row: 1 / 3; }
      .phone-number { grid-column: 2; min-height: 44px; margin-bottom: -4px; }
      .primary-button { font-size: 14px; }
    }
    @keyframes arrive { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
    .reduced-effects *, .reduced-effects *::before, .reduced-effects *::after { animation: none !important; transition: none !important; }
  </style>
</head>
<body data-state="loading">
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="17" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 17H15a4 4 0 0 0 0-8h-4a3 3 0 0 1 0-6h1"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-navi" viewBox="0 0 24 24"><path d="m12 3 8 18-8-4-8 4L12 3Z"/><path d="M12 17V9"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M8.5 3H5a2 2 0 0 0-2 2.2A18 18 0 0 0 18.8 21a2 2 0 0 0 2.2-2v-3.5l-5-1.5-1.7 2a14 14 0 0 1-6.3-6.3L10 8 8.5 3Z"/></symbol>
    <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 10 10 0 0 1-4-.8L3 21l1.8-5.5a10 10 0 0 1-.8-4 8.5 8.5 0 0 1 17 0Z"/><path d="M8 11h8m-8 4h5"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.7 13.4A9 9 0 0 1 10.6 3.3a9 9 0 1 0 10.1 10.1Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 3v.1"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.2 6.2A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.8 5.8"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><path d="m3 3 18 18M3 8a15 15 0 0 1 3-1.8M10 4.2A15 15 0 0 1 21 8M6.5 11.5a9 9 0 0 1 2.6-1.6M14 9.3a9 9 0 0 1 3.5 2.2M10 15a3 3 0 0 1 4 0m-2 4v.1"/></symbol>
    <symbol id="i-desktop" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="13" rx="2"/><path d="M8 21h8m-4-5v5"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8.5 12 2.3 2.3 4.7-4.7"/></symbol>

  <main class="page-shell">
    <header class="app-header">
      <div class="brand" id="brand"><span class="brand-mark" id="brandMark" aria-hidden="true"><svg class="icon"><use href="#i-route"/></svg></span><span id="brandText">현장 길안내</span></div>
      <button type="button" class="theme-switch" id="themeSwitch" aria-label="어두운 화면으로 변경" aria-pressed="false"><svg class="icon" aria-hidden="true"><use id="themeIcon" href="#i-moon"/></svg></button>
    </header>

    <div class="intro">
      <p class="intro-title">현장까지,<br><span>간편하게.</span></p>
    </div>

    <noscript><style>.navigation{display:none}</style><div class="no-script"><p>길안내를 이용하려면 브라우저의 JavaScript를 켜 주세요. 아래 버튼으로 담당자에게 연락할 수 있어요.</p></div></noscript>

    <section class="destination" id="destination" aria-labelledby="destinationTitle" aria-busy="true">
      <svg class="route-art" viewBox="0 0 142 122" fill="none" aria-hidden="true">
        <path class="ra-bg" d="M152 3H84c-45 0-45 63 0 63h19c14 0 14 16 0 16H59"/>
        <path class="ra-wait" pathLength="100" d="M156 15H88c-27 0-27 39 0 39h17c32 0 32 40 0 40H68"/>
        <path class="ra-live" pathLength="100" d="M156 15H88c-27 0-27 39 0 39h17c32 0 32 40 0 40H68"/>
        <circle class="ra-ring" cx="57" cy="88" r="11"/>
        <circle class="ra-dot" cx="57" cy="88" r="4"/>
      </svg>
      <div class="destination-top">
        <p class="destination-label"><svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg>방문할 목적지</p>
        <span class="destination-tag" id="destinationTag">확인 중</span>
      </div>
      <h1 id="destinationTitle">방문할 현장</h1>
      <div class="address-block">
        <div class="address-text"><p class="address" id="address">전달받은 목적지를 확인하고 있어요.</p><p class="coordinates" id="coordinates" hidden></p></div>
        <button type="button" id="copyAddress" class="copy-button" aria-label="목적지 주소 복사" hidden><svg class="icon" aria-hidden="true"><use id="copyIcon" href="#i-copy"/></svg><span id="copyLabel">주소 복사</span></button>
      </div>
    </section>

    <section class="navigation" aria-label="길안내 시작">
      <div class="status-panel" id="statusPanel" data-tone="info" role="status" aria-live="polite" aria-atomic="true">
        <svg class="icon" aria-hidden="true"><use id="statusIcon" href="#i-clock"/></svg>
        <div class="status-copy"><p class="status-title" id="statusTitle">목적지를 확인하고 있어요</p><p class="status-description" id="statusDescription">잠시만 기다려 주세요.</p></div>
      </div>

    <section class="contact" id="contact" aria-labelledby="contactHeading">
      <h2 class="section-heading" id="contactHeading">도움이 필요하신가요?</h2>
      <div class="contact-card">
        <div class="contact-identity">
          <div class="avatar" id="avatar" aria-hidden="true">한</div>
          <div><p class="contact-role" id="contactRole">시스템 담당자</p><p class="contact-name" id="contactName">한명국</p></div>
          <a class="phone-number" id="phoneNumber" href="tel:01046912521" data-contact="call">010-4691-2521</a>
        </div>
        <div class="contact-actions">
          <a class="contact-action call" id="callButton" href="tel:01046912521" data-contact="call" aria-label="한명국 담당자에게 전화하기"><svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg>전화하기</a>
          <a class="contact-action" id="smsButton" href="sms:01046912521" data-contact="sms" aria-label="한명국 담당자에게 문자 보내기"><svg class="icon" aria-hidden="true"><use href="#i-message"/></svg>문자 보내기</a>
        </div>

  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"><svg class="icon" aria-hidden="true"><use id="toastIcon" href="#i-check"/></svg><span id="toastText"></span></div>

  <script>
  (function () {
    'use strict';
    /* ── 운영 설정 ──────────────────────────────────────────────────
       기존 JavaScript 키와 URL 형식을 유지합니다. REST 키는 사용하지 않습니다.
       주소: ?name=현장명&addr=주소
       좌표: ?name=현장명&lat=37.501&lng=127.0396
       autoOpen을 false로 바꾸면 출발 버튼을 눌렀을 때만 앱을 엽니다.
       (아이폰은 자동 실행이 막히므로 항상 버튼으로 엽니다.)
    ─────────────────────────────────────────────────────────────── */
    const CONFIG = {
      jsKey: '3481cdf4ec96ad372e2440d8e832bcf0',
      company: '한국방제 현장 길안내',   // 상단 브랜드 문구
      logo: '',                          // 로고 이미지 주소 (예: 'logo.png'). 비우면 아이콘 + 문구 표시
      contactName: '한명국',
      contactRole: '시스템 담당자',
      phone: '01046912521',
      sdkUrl: 'https://t1.kakaocdn.net/kakao_js_sdk/2.8.4/kakao.min.js',
      autoOpen: true,
      timeoutMs: 15000
    };
    /* preview.html이 주입하는 모드. 실제 SDK/전화/문자 호출은 하지 않습니다. */
    const PREVIEW = window.__NAVI_PREVIEW__ || null;
    const $ = function (id) { return document.getElementById(id); };
    const q = new URLSearchParams(location.search);
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || isIOS;
    const rawLat = (q.get('lat') || '').trim();
    const rawLng = (q.get('lng') || '').trim();
    let address = (q.get('addr') || '').trim();
    let placeName = (q.get('name') || '').trim() || address || '방문할 현장';
    let currentState = 'loading';
    let coordinates = null;
    let requestId = 0;
    let requestTimer;
    let autoOpened = false;
    let launchCooldown = false;
    let toastTimer;
    let copyTimer;
    let previewTimer;
    const scriptPromises = {};

    if (PREVIEW) {
      placeName = PREVIEW.name || '테헤란로 현장';
      address = PREVIEW.addr === undefined ? '서울특별시 강남구 테헤란로27길 40' : PREVIEW.addr;
      coordinates = { x: 127.0396, y: 37.501 };
      if (PREVIEW.state === 'missing') { placeName = '방문할 현장'; address = ''; coordinates = null; }
      if (PREVIEW.state === 'coordinates') address = '';
      if (PREVIEW.state === 'longtext') {
        placeName = PREVIEW.name || '강남 테헤란로 복합업무시설 신축공사 제2현장';
        address = PREVIEW.addr || '서울특별시 강남구 테헤란로27길 40, 지하 2층 현장사무실 (방문 차량은 북측 출입구 이용)';
      }
    }

    if ((navigator.connection && navigator.connection.saveData) || (navigator.deviceMemory && navigator.deviceMemory <= 2)) {
      document.documentElement.classList.add('reduced-effects');
    }

    function setIcon(id, icon) { $(id).setAttribute('href', '#i-' + icon); }
    function announceHeight() {
      if (PREVIEW && window.parent !== window) {
        window.parent.postMessage({ type: 'navi-preview-height', height: document.documentElement.scrollHeight }, '*');
      }
    }
    function updateTheme() {
      const dark = document.documentElement.dataset.theme === 'dark';
      $('themeSwitch').setAttribute('aria-pressed', String(dark));
      $('themeSwitch').setAttribute('aria-label', dark ? '밝은 화면으로 변경' : '어두운 화면으로 변경');
      $('themeColor').content = dark ? '#141d19' : '#f5f5ef';
      setIcon('themeIcon', dark ? 'sun' : 'moon');
    }
    $('themeSwitch').addEventListener('click', function () {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      if (!PREVIEW) { try { localStorage.setItem('field-navi-theme', next); } catch (e) {} }
      updateTheme();
    });
    updateTheme();

    function showToast(message, hold, icon) {
      clearTimeout(toastTimer);
      setIcon('toastIcon', icon || 'check');
      $('toastText').textContent = message;
      $('toast').classList.add('show');
      if (!hold) toastTimer = setTimeout(function () { $('toast').classList.remove('show'); }, 3200);
    }
    function legacyCopy(text) {
      const active = document.activeElement;
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.setAttribute('aria-hidden', 'true');
      ta.tabIndex = -1;
      ta.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;font-size:16px';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      let copied = false;
      try { copied = document.execCommand('copy'); } catch (e) {}
      ta.remove();
      if (active && active.focus) { try { active.focus({ preventScroll: true }); } catch (e) { active.focus(); } }
      return copied;
    }
    function copyText(text) {
      if (PREVIEW) return Promise.resolve(true);
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacyCopy(text); });
      }
      return Promise.resolve(legacyCopy(text));
    }
    function copiedFeedback(hold) {
      clearTimeout(copyTimer);
      setIcon('copyIcon', 'check');
      $('copyLabel').textContent = '복사 완료';
      showToast('주소를 복사했어요', hold);
      if (!hold) copyTimer = setTimeout(function () { setIcon('copyIcon', 'copy'); $('copyLabel').textContent = '주소 복사'; }, 3200);
    }
    $('copyAddress').addEventListener('click', function () {
      if (!address) return;
      copyText(address).then(function (ok) {
        if (ok) { buzz(); copiedFeedback(false); }
        else showToast('복사하지 못했어요. 주소를 길게 눌러 복사해 주세요.', false, 'alert');
      });
    });

    function buzz() { try { if (navigator.vibrate) navigator.vibrate(10); } catch (e) {} } /* 안드로이드 진동 피드백 */

    $('brandText').textContent = CONFIG.company;
    if (CONFIG.logo) {
      const logo = new Image();
      logo.className = 'brand-logo';
      logo.alt = CONFIG.company;
      logo.onload = function () { $('brandMark').hidden = true; $('brandText').hidden = true; };
      logo.onerror = function () { logo.remove(); };
      logo.src = CONFIG.logo;
      $('brand').prepend(logo);
    }
    const phoneDigits = CONFIG.phone.replace(/[^0-9]/g, '');
    const phoneLabel = phoneDigits.length === 11 ? phoneDigits.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3') : CONFIG.phone;
    $('avatar').textContent = CONFIG.contactName.charAt(0);
    $('contactName').textContent = CONFIG.contactName;
    $('contactRole').textContent = CONFIG.contactRole;
    $('phoneNumber').textContent = phoneLabel;
    $('phoneNumber').setAttribute('aria-label', CONFIG.contactRole + ' ' + CONFIG.contactName + ' ' + phoneLabel + '로 전화');
    $('callButton').setAttribute('aria-label', CONFIG.contactName + ' 담당자에게 전화하기');
    $('smsButton').setAttribute('aria-label', CONFIG.contactName + ' 담당자에게 문자 보내기');

    $('destinationTitle').textContent = placeName;
    $('address').textContent = address || '전달받은 위치로 안내합니다.';
    $('copyAddress').hidden = !address;
    document.title = (placeName === '방문할 현장' ? '현장 길안내' : placeName + ' · 현장 길안내');
    $('callButton').href = $('phoneNumber').href = 'tel:' + CONFIG.phone;
    const smsBody = '[현장 길안내 문의] ' + placeName + (address && address !== placeName ? ' (' + address + ')' : '') + ' - 길안내가 시작되지 않습니다.';
    $('smsButton').href = 'sms:' + CONFIG.phone + (isIOS ? '&' : '?') + 'body=' + encodeURIComponent(smsBody);
    if (PREVIEW) {
      document.querySelectorAll('[data-contact]').forEach(function (link) {
        link.addEventListener('click', function (event) {
          event.preventDefault();
          showToast(link.dataset.contact === 'call' ? '미리보기 · 한명국님에게 전화 연결' : '미리보기 · 현장명이 담긴 문자창 열기');
        });
      });
    }

    const STATES = {
      loading: { tag: '확인 중', title: '목적지를 확인하고 있어요', detail: '잠시만 기다려 주세요.', icon: 'clock', cta: '길안내 준비 중', action: 'wait' },
      ready: { tag: '방문 장소', title: '목적지를 확인했어요', detail: isIOS ? '아래 노란 버튼을 눌러 카카오내비로 출발하세요.' : '카카오내비가 자동으로 열려요. 열리지 않으면 아래 버튼을 눌러 주세요.', icon: 'check', cta: '카카오내비로 출발하기', action: 'navigate', buttonIcon: 'navi' },
      opening: { tag: '방문 장소', title: '카카오내비에 연결하고 있어요', detail: '앱이 열리지 않으면 버튼을 다시 눌러 주세요.', icon: 'navi', cta: '카카오내비 다시 열기', action: 'navigate', buttonIcon: 'navi' },
      notfound: { tag: '주소 확인', title: '주소를 확인할 수 없어요', detail: '전달받은 주소를 확인하거나 담당자에게 문의해 주세요.', icon: 'pin', tone: 'error', cta: '주소 다시 확인하기', action: 'retry' },
      offline: { tag: '연결 확인', title: '인터넷 연결을 확인해 주세요', detail: 'Wi-Fi 또는 모바일 데이터를 켠 뒤 다시 시도해 주세요.', icon: 'wifi', tone: 'error', cta: '연결 다시 확인하기', action: 'retry' },
      timeout: { tag: '응답 지연', title: '연결이 조금 늦어지고 있어요', detail: '인터넷 연결을 확인한 뒤 다시 시도해 주세요.', icon: 'clock', tone: 'error', cta: '다시 시도하기', action: 'retry' },
      sdkerror: { tag: '연결 확인', title: '길안내를 준비하지 못했어요', detail: '잠시 후 다시 시도해 주세요. 계속되면 담당자에게 문의해 주세요.', icon: 'alert', tone: 'error', cta: '다시 시도하기', action: 'retry' },
      missing: { tag: '정보 필요', title: '담당자에게 링크를 요청해 주세요', detail: '주소가 포함된 안내 링크를 받으면 바로 출발할 수 있어요.', icon: 'pin', tone: 'error', cta: '담당자에게 문의하기', action: 'contact', buttonIcon: 'message' },
      invalid: { tag: '위치 확인', title: '목적지 위치가 올바르지 않아요', detail: '담당자에게 정확한 위치가 담긴 링크를 다시 요청해 주세요.', icon: 'pin', tone: 'error', cta: '담당자에게 문의하기', action: 'contact', buttonIcon: 'message' },
      desktop: { tag: '방문 장소', title: '길안내는 휴대폰에서 시작해 주세요', detail: '이 페이지의 링크를 휴대폰으로 보내 열어 주세요.', icon: 'desktop', cta: '안내 링크 복사하기', action: 'copylink', buttonIcon: 'copy' },
      launcherror: { tag: '방문 장소', title: '카카오내비를 열지 못했어요', detail: '앱 설치 여부를 확인한 뒤 다시 눌러 주세요.', icon: 'alert', tone: 'error', cta: '카카오내비 다시 열기', action: 'navigate', buttonIcon: 'navi' }
    };

    function renderState(state) {
      const model = STATES[state] || STATES.sdkerror;
      currentState = STATES[state] ? state : 'sdkerror';
      document.body.dataset.state = currentState;
      document.body.dataset.tone = model.tone || 'info';
      document.body.dataset.found = coordinates && currentState !== 'loading' ? '1' : '0';
      $('destination').setAttribute('aria-busy', String(state === 'loading'));
      $('destinationTag').textContent = model.tag;
      $('statusPanel').hidden = !model.title;
      $('statusPanel').dataset.tone = model.tone || 'info';
      $('statusTitle').textContent = model.title || '';
      $('statusDescription').textContent = model.detail || '';
      setIcon('statusIcon', model.icon || 'alert');
      $('primaryText').textContent = model.cta;
      $('primaryButton').disabled = model.action === 'wait';
      $('primaryButton').dataset.variant = model.action === 'navigate' ? 'primary' : 'secondary';
      $('primarySpinner').hidden = state !== 'loading';
      $('primaryIconWrap').toggleAttribute('hidden', state === 'loading');
      setIcon('primaryIcon', model.buttonIcon || 'refresh');
      $('help').hidden = ['ready', 'opening', 'launcherror', 'desktop'].indexOf(state) === -1;
      if (state === 'missing') {
        $('destinationTitle').textContent = '목적지 정보가 없어요';
        $('address').textContent = '받으신 링크에 목적지가 포함되어 있지 않아요.';
      }
      if (state === 'invalid' && !address) $('address').textContent = '전달받은 위치를 확인할 수 없어요.';
      announceHeight();
    }

    function validCoordinates(x, y) {
      return Number.isFinite(x) && Number.isFinite(y) && x >= -180 && x <= 180 && y >= -90 && y <= 90;
    }
    function displayCoordinates() {
      if (!address && coordinates) {
        $('coordinates').textContent = '위도 ' + coordinates.y.toFixed(5) + ' · 경도 ' + coordinates.x.toFixed(5);
        $('coordinates').hidden = false;
      }
    }

    function startNavi() {
      if (launchCooldown || !coordinates) return;
      launchCooldown = true;
      setTimeout(function () { launchCooldown = false; }, 900);
      buzz();
      if (PREVIEW) { renderState('opening'); return; }
      if (!isMobile) { renderState('desktop'); return; }
      try {
        if (!window.Kakao || !Kakao.Navi || !Kakao.isInitialized()) throw new Error('Kakao Navi is not initialized');
        Kakao.Navi.start({ name: placeName, x: coordinates.x, y: coordinates.y, coordType: 'wgs84' });
        renderState('opening');
      } catch (error) {
        console.warn('[현장 길안내] 앱 연결 실패', error);
        renderState('launcherror');
      }
    }

    $('primaryButton').addEventListener('click', function () {
      const action = STATES[currentState].action;
      if (action === 'navigate') startNavi();
      if (action === 'retry') {
        if (PREVIEW) {
          renderState('loading');
          clearTimeout(previewTimer);
          previewTimer = setTimeout(function () { renderState('ready'); }, 900);
        } else resolveDestination();
      }
      if (action === 'contact') {
        $('contact').scrollIntoView({ behavior: 'auto', block: 'center' });
        $('callButton').focus({ preventScroll: true });
      }
      if (action === 'copylink') {
        copyText(location.href).then(function (ok) { showToast(ok ? '안내 링크를 복사했어요' : '주소창의 링크를 복사해 주세요.', false, ok ? 'check' : 'alert'); });
      }
    });
    $('help').addEventListener('toggle', announceHeight);

    /* 외부 스크립트는 본문을 먼저 표시한 뒤 비동기로 불러옵니다. */
    function loadScript(id, src) {
      if (scriptPromises[id]) return scriptPromises[id];
      scriptPromises[id] = new Promise(function (resolve, reject) {
        const previous = document.getElementById(id);
        if (previous) previous.remove();
        const script = document.createElement('script');
        script.id = id;
        script.async = true;
        script.src = src;
        let settled = false;
        let timer;
        function finish(ok) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          script.onload = script.onerror = null;
          if (ok) resolve();
          else {
            script.remove();
            delete scriptPromises[id];
            reject(new Error('SDK load failed: ' + id));
          }
        }
        script.onload = function () { finish(true); };
        script.onerror = function () { finish(false); };
        timer = setTimeout(function () { finish(false); }, CONFIG.timeoutMs - 1000);
        document.head.appendChild(script);
      });
      return scriptPromises[id];
    }

    function loadNaviSDK() {
      const loaded = window.Kakao && window.Kakao.Navi ? Promise.resolve() : loadScript('kakao-navi-sdk', CONFIG.sdkUrl);
      return loaded.then(function () {
        if (!window.Kakao || !Kakao.Navi) {
          delete scriptPromises['kakao-navi-sdk'];
          throw new Error('Kakao Navi SDK unavailable');
        }
        if (!Kakao.isInitialized()) Kakao.init(CONFIG.jsKey);
        if (!Kakao.isInitialized()) throw new Error('Kakao initialization failed');
      });
    }
    function loadMapServices() {
      if (window.kakao && kakao.maps && kakao.maps.services) return Promise.resolve();
      return loadScript('kakao-map-sdk', 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(CONFIG.jsKey) + '&libraries=services&autoload=false').then(function () {
        return new Promise(function (resolve, reject) {
          if (!window.kakao || !kakao.maps || !kakao.maps.load) {
            delete scriptPromises['kakao-map-sdk'];
            reject(new Error('Kakao maps SDK unavailable'));
            return;
          }
          kakao.maps.load(function () {
            if (kakao.maps.services) resolve();
            else {
              delete scriptPromises['kakao-map-sdk'];
              reject(new Error('Kakao map services unavailable'));
            }
          });
        });
      });
    }

    function resolveDestination() {
      const token = ++requestId;
      clearTimeout(requestTimer);
      coordinates = null;
      if (rawLat && rawLng) {
        const x = Number(rawLng), y = Number(rawLat);
        if (!validCoordinates(x, y)) { renderState('invalid'); return; }
        coordinates = { x: x, y: y };
      } else if (!address) {
        renderState(rawLat || rawLng ? 'invalid' : 'missing');
        return;
      }
      if (navigator.onLine === false) { renderState('offline'); return; }
      renderState('loading');
      requestTimer = setTimeout(function () {
        if (token !== requestId) return;
        requestId++;
        renderState(navigator.onLine === false ? 'offline' : 'timeout');
      }, CONFIG.timeoutMs);
      function fail(state, error) {
        if (token !== requestId) return;
        clearTimeout(requestTimer);
        if (error) console.warn('[현장 길안내] 연결 오류', error);
        renderState(navigator.onLine === false ? 'offline' : state);
      }
      function ready(x, y) {
        if (token !== requestId) return;
        clearTimeout(requestTimer);
        x = Number(x); y = Number(y);
        if (!validCoordinates(x, y)) { fail('notfound'); return; }
        coordinates = { x: x, y: y };
        displayCoordinates();
        renderState(isMobile ? 'ready' : 'desktop');
        /* 기존처럼 페이지에서 최초 준비 성공 시 모바일 자동 실행은 최대 1회입니다. */
        if (isMobile && !isIOS && CONFIG.autoOpen && !autoOpened) {
          autoOpened = true;
          setTimeout(function () { if (token === requestId && currentState === 'ready') startNavi(); }, 800);
        }
      }
      function searchAddress() {
        if (token !== requestId) return;
        try {
          const services = kakao.maps.services;
          new services.Geocoder().addressSearch(address, function (results, status) {
            if (token !== requestId) return;
            if (status === services.Status.OK && results && results.length) { ready(results[0].x, results[0].y); return; }
            if (status !== services.Status.ZERO_RESULT) { fail('sdkerror'); return; }
            try {
              new services.Places().keywordSearch(address, function (places, placeStatus) {
                if (token !== requestId) return;
                if (placeStatus === services.Status.OK && places && places.length) ready(places[0].x, places[0].y);
                else fail(placeStatus === services.Status.ZERO_RESULT ? 'notfound' : 'sdkerror');
              });
            } catch (error) { fail('sdkerror', error); }
          });
        } catch (error) { fail('sdkerror', error); }
      }
      if (coordinates) {
        const supplied = coordinates;
        loadNaviSDK().then(function () { ready(supplied.x, supplied.y); }).catch(function (error) { fail('sdkerror', error); });
      } else {
        Promise.all([loadNaviSDK(), loadMapServices()]).then(searchAddress).catch(function (error) { fail('sdkerror', error); });
      }
    }

    document.addEventListener('visibilitychange', function () {
      /* 앱에서 돌아왔을 때 '연결 중' 안내를 계속 남기지 않습니다. */
      if (!PREVIEW && !document.hidden && currentState === 'opening') renderState('ready');
    });
    window.addEventListener('offline', function () {
      if (PREVIEW || ['missing', 'invalid'].indexOf(currentState) !== -1) return;
      ++requestId;
      clearTimeout(requestTimer);
      renderState('offline');
    });
    window.addEventListener('online', function () {
      if (!PREVIEW && currentState === 'offline') showToast('인터넷에 연결됐어요. 다시 시도해 주세요.');
    });

    if (PREVIEW) {
      const requested = PREVIEW.state || 'ready';
      renderState(['copied', 'longtext', 'coordinates'].indexOf(requested) !== -1 ? 'ready' : requested);
      if (requested === 'coordinates') displayCoordinates();
      if (requested === 'copied') copiedFeedback(true);
      if (window.ResizeObserver) new ResizeObserver(announceHeight).observe(document.querySelector('.page-shell'));
      announceHeight();
    } else resolveDestination();
  })();
  </script>
</body>
</html>
